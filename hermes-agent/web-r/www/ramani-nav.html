<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>MTAALAMU SMART — Ramani, Navigation & Sauti</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #0b1220; --card: #152033; --accent: #22c55e; --danger: #ef4444;
      --warn: #f59e0b; --info: #38bdf8; --text: #f1f5f9; --muted: #94a3b8; --border: #243044;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    #app { display: flex; flex-direction: column; height: 100%; }
    header {
      padding: 0.55rem 0.75rem; background: var(--card); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    }
    header h1 { font-size: 0.95rem; font-weight: 700; white-space: nowrap; }
    .search-wrap { flex: 1; min-width: 160px; position: relative; }
    #search {
      width: 100%; padding: 0.5rem 0.7rem; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 0.92rem;
    }
    #suggestions {
      position: absolute; left: 0; right: 0; top: 100%; z-index: 2000;
      background: var(--card); border: 1px solid var(--border); border-radius: 0 0 8px 8px;
      max-height: 260px; overflow-y: auto; display: none;
    }
    #suggestions div {
      padding: 0.45rem 0.7rem; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 0.88rem;
    }
    #suggestions div:hover { background: #1e2d45; }
    #suggestions .lvl { color: var(--muted); font-size: 0.72rem; margin-left: 0.35rem; }
    .btns { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    button {
      padding: 0.45rem 0.65rem; border-radius: 8px; border: none; cursor: pointer;
      font-weight: 600; font-size: 0.8rem; background: var(--accent); color: #052e16;
    }
    button.sec { background: var(--border); color: var(--text); }
    button.danger { background: var(--danger); color: #fff; }
    button.on { outline: 2px solid var(--accent); }
    #map { flex: 1; min-height: 180px; }
    #panel {
      background: var(--card); border-top: 1px solid var(--border);
      padding: 0.65rem 0.85rem; max-height: 32vh; overflow-y: auto;
    }
    #instruction { font-size: 1.02rem; line-height: 1.4; margin-bottom: 0.4rem; font-weight: 500; }
    #steps { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.4rem; max-height: 90px; overflow-y: auto; }
    #steps li { margin-left: 1.1rem; margin-bottom: 0.15rem; }
    #meta { font-size: 0.75rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; }
    .badge {
      display: inline-block; padding: 0.12rem 0.4rem; border-radius: 4px;
      font-size: 0.68rem; background: #243044;
    }
    .badge.ok { background: #166534; color: #bbf7d0; }
    .badge.warn { background: #92400e; color: #fde68a; }
    .badge.danger { background: #7f1d1d; color: #fecaca; }
    .badge.info { background: #0c4a6e; color: #bae6fd; }
    .weather-box {
      margin-top: 0.35rem; padding: 0.4rem 0.5rem; border-radius: 6px;
      background: #0f1a2e; border: 1px solid var(--border); font-size: 0.8rem;
    }
    .person-dot { background: transparent !important; border: none !important; }
    .person-dot span {
      display: block; width: 14px; height: 14px; border-radius: 50%;
      background: #38bdf8; border: 2px solid #fff; box-shadow: 0 0 6px #38bdf8;
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>🧭 MTAALAMU</h1>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Tafuta mkoa, wilaya, kata, kijiji, mtaa, barabara..." autocomplete="off" />
      <div id="suggestions"></div>
    </div>
    <div class="btns">
      <button type="button" id="btnGps">📍 GPS</button>
      <button type="button" id="btnRoute" class="sec">🛣️ Njia</button>
      <button type="button" id="btnNav" class="sec">▶️ Anza</button>
      <button type="button" id="btnSpeak" class="sec">🔊 Sauti</button>
      <button type="button" id="btnVoice" class="sec" title="Washa/zima sauti ya maelekezo (sw-TZ)">🔈 Sauti: ON</button>
      <button type="button" id="btnWeather" class="sec">☁️ Hewa</button>
      <button type="button" id="btnHazards" class="sec">⚠️ Hatari</button>
      <button type="button" id="btnLive" class="sec">🚶 Live</button>
      <button type="button" id="btnStop" class="danger" style="display:none">⏹ Simamisha</button>
    </div>
  </header>
  <div id="map"></div>
  <div id="panel">
    <div id="instruction">Karibu. Bonyeza GPS, tafuta sehemu, kisha Njia. Navigation kwa Kiswahili + sauti.</div>
    <ol id="steps"></ol>
    <div id="meta">
      <span class="badge" id="gpsStatus">GPS: —</span>
      <span class="badge" id="routeStatus">Njia: —</span>
      <span class="badge" id="navStatus">Nav: —</span>
      <span class="badge info" id="weatherBadge">Hewa: —</span>
    </div>
    <div id="weatherBox" class="weather-box" style="display:none"></div>
  </div>
</div>

/* SAUTI (VOICE) — jinsi inavyofanya kazi:
 * 1) Browser ina Web Speech API (speechSynthesis) — bure, ndani ya kifaa.
 * 2) Tunauliza voice ya Kiswahili (lang inaanza na "sw" au ina "Swahili").
 *    Kama hakuna, browser inatumia voice yoyote inayopatikana (matamshi yanabaki).
 * 3) Kitufe "Sauti: ON/OFF" kinafungua/kuzima kabisa (voiceOn).
 * 4) Kila hatua ya njia inasemwa wakati unafika karibu nayo (80m) — kama Google Maps.
 */
function speak(text){
  if(!voiceOn||!window.speechSynthesis||!text) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="sw-TZ"; u.rate=0.92;
  const voices=speechSynthesis.getVoices();
  const sw=voices.find(v=>v.lang&&(v.lang.startsWith("sw")||v.lang.includes("Swahili")));
  if(sw) u.voice=sw;
  speechSynthesis.speak(u);
}
if(window.speechSynthesis) speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
document.getElementById("btnVoice").onclick=()=>{
  voiceOn=!voiceOn;
  const b=document.getElementById("btnVoice");
  b.textContent=voiceOn?"🔊 Sauti: ON":"🔈 Sauti: OFF";
  b.classList.toggle("on",voiceOn);
  if(voiceOn) speak("Sauti imewashwa.");
  else if(window.speechSynthesis) speechSynthesis.cancel();
};

function distM(a,b){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(b[0]-a[0]), dLng=toR(b[1]-a[1]);
  const x=Math.sin(dLat/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function maneuverSw(step){
  const m=(step.maneuver&&step.maneuver.type)?step.maneuver.type:"continue";
  const mod=(step.maneuver&&step.maneuver.modifier)?step.maneuver.modifier:"";
  let key=m; if(m==="turn"&&mod) key="turn-"+mod;
  const base=MANEUVER_SW[key]||MANEUVER_SW[m]||"Endelea";
  const road=step.name||step.ref||"";
  const d=Math.round(step.distance||0);
  let phrase="";
  if(d>=1000) phrase="Baada ya kilomita "+(d/1000).toFixed(1)+", ";
  else if(d>20) phrase="Baada ya mita "+d+", ";
  phrase+=base; if(road) phrase+=" kwenye "+road;
  return phrase;
}

const searchEl=document.getElementById("search");
const sugEl=document.getElementById("suggestions");
let searchTimer=null;
searchEl.addEventListener("input",()=>{
  clearTimeout(searchTimer);
  const q=searchEl.value.trim();
  if(q.length<1){sugEl.style.display="none";return;}
  searchTimer=setTimeout(()=>doSearch(q),280);
});
/* HIERARKIA kamili (mikoa→wilaya→tarafa→kata→vijiji→vitongoji→mtaa→barabara)
 * inapakiwa kutoka geo_hierarchy_index.json — inaongezwa kwenye PLACES punde
 * itakapofika, hivyo search inapata sehemu zote (data-driven JSON). */
let HIER_PLACES=[];
(async()=>{try{
  const h=await fetch("../data/geo_hierarchy_index.json");
  if(h.ok){
    const d=await h.json();
    HIER_PLACES=(d.features||[]).map(f=>{const p=f.properties;return{
      id:p.id,name:p.name_sw,level:p.level,lat:p.lat,lng:p.lng,
      region:p.region,parent:p.parent||""
    };});
    PLACES.push(...HIER_PLACES);
  }
}catch(e){}})();
const LEVEL_SW={mkoa:"Mkoa",wilaya:"Wilaya",tarafa:"Tarafa",kata:"Kata",kijiji:"Kijiji",vitongoji:"Kitongoji",mtaa:"Mtaa",barabara:"Barabara"};

async function doSearch(q){
  const ql=q.toLowerCase();
  const local=PLACES.filter(p=>p.name.toLowerCase().includes(ql)||p.level.includes(ql)||String(p.id).toLowerCase().includes(ql)).slice(0,10);
  let remote=[];
  try{
    const url="https://nominatim.openstreetmap.org/search?format=json&countrycodes=tz&limit=8&q="+encodeURIComponent(q);
    const res=await fetch(url,{headers:{"Accept-Language":"sw,en"}});
    const data=await res.json();
    remote=(data||[]).map(r=>({id:"osm-"+r.place_id,name:r.display_name.split(",")[0],full:r.display_name,level:r.type||r.class||"sehemu",lat:parseFloat(r.lat),lng:parseFloat(r.lon)}));
  }catch(e){}
  const hits=[...local,...remote].slice(0,14);
  if(!hits.length){sugEl.style.display="none";return;}
  sugEl.innerHTML=hits.map((p,i)=>`<div data-i="${i}"><strong>${p.name}</strong><span class="lvl">${LEVEL_SW[p.level]||p.level}${p.region?" · "+p.region+(p.parent?" — "+p.parent:""):p.full?" · "+p.full.split(",").slice(1,3).join(","):""}</span></div>`).join("");
  sugEl.style.display="block"; sugEl._hits=hits;
  sugEl.querySelectorAll("div").forEach(el=>{el.onclick=()=>{const p=sugEl._hits[parseInt(el.dataset.i,10)];if(!p)return;selectDestination(p);sugEl.style.display="none";searchEl.value=p.name;};});
}
document.addEventListener("click",(e)=>{if(!e.target.closest(".search-wrap"))sugEl.style.display="none";});

function selectDestination(p){
  destination=p;
  if(destMarker)map.removeLayer(destMarker);
  destMarker=L.marker([p.lat,p.lng]).addTo(map).bindPopup("<b>"+p.name+"</b><br/>"+(LEVEL_SW[p.level]||p.level||"")+(p.region?" · Mkoa wa "+p.region+(p.parent?" — "+p.parent:""):"")).openPopup();
  map.flyTo([p.lat,p.lng],Math.max(map.getZoom(),13));
  setInstruction("Sehemu: "+p.name+". Bonyeza Njia, kisha Anza.");
  speak("Sehemu unayoenda: "+p.name);
}
map.on("click",(e)=>{selectDestination({id:"custom",name:"Sehemu uliyochagua",level:"custom",lat:e.latlng.lat,lng:e.latlng.lng});searchEl.value="Sehemu uliyochagua";});

document.getElementById("btnGps").onclick=()=>{
  if(!navigator.geolocation){setInstruction("GPS haipatikani.");speak(VOICE_PROMPTS.gps_fail);return;}
  document.getElementById("gpsStatus").textContent="GPS: inatafuta...";
  document.getElementById("gpsStatus").className="badge warn";
  speak(VOICE_PROMPTS.gps_searching);
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      currentPos=[pos.coords.latitude,pos.coords.longitude];
      placeUser(currentPos,pos.coords.accuracy);
      map.flyTo(currentPos,15);
      document.getElementById("gpsStatus").textContent="GPS: OK (±"+Math.round(pos.coords.accuracy)+"m)";
      document.getElementById("gpsStatus").className="badge ok";
      setInstruction("Mahali ulipo limetambuliwa. Chagua sehemu unayoenda.");
      speak(VOICE_PROMPTS.gps_ok);
      loadWeather(currentPos[0],currentPos[1]);
    },
    ()=>{document.getElementById("gpsStatus").textContent="GPS: imeshindwa";document.getElementById("gpsStatus").className="badge danger";setInstruction("Haikuweza kupata GPS. Ruhusu location.");speak(VOICE_PROMPTS.gps_fail);},
    {enableHighAccuracy:true,timeout:18000}
  );
};
function placeUser(ll,accuracy){
  if(userMarker)map.removeLayer(userMarker);
  userMarker=L.circleMarker(ll,{radius:9,color:"#22c55e",fillColor:"#22c55e",fillOpacity:0.9,weight:2}).addTo(map).bindPopup("Mahali ulipo");
}

document.getElementById("btnRoute").onclick=()=>buildRoute();
async function buildRoute(){
  if(!destination){setInstruction("Chagua sehemu kwanza.");speak(VOICE_PROMPTS.select);return;}
  const start=currentPos||[-6.7924,39.2083];
  if(!currentPos)setInstruction("Hakuna GPS — kutumia kituo cha Dar. Bonyeza GPS kwa usahihi.");
  document.getElementById("routeStatus").textContent="Njia: inahesabu...";
  document.getElementById("routeStatus").className="badge warn";
  const url=`https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${destination.lng},${destination.lat}?overview=full&geometries=geojson&steps=true`;
  try{
    const res=await fetch(url); const data=await res.json();
    if(data.code!=="Ok"||!data.routes||!data.routes[0])throw new Error("Hakuna njia");
    const route=data.routes[0];
    routeCoords=route.geometry.coordinates.map(c=>[c[1],c[0]]);
    if(routeLine)map.removeLayer(routeLine);
    routeLine=L.polyline(routeCoords,{color:"#22c55e",weight:6,opacity:0.9}).addTo(map);
    map.fitBounds(routeLine.getBounds(),{padding:[50,50]});
    routeSteps=(route.legs&&route.legs[0]&&route.legs[0].steps)?route.legs[0].steps:[];
    const km=(route.distance/1000).toFixed(1), min=Math.round(route.duration/60);
    document.getElementById("steps").innerHTML=routeSteps.slice(0,12).map(s=>"<li>"+maneuverSw(s)+"</li>").join("");
    setInstruction("Njia tayari: "+km+" km, dakika ~"+min+". Bonyeza Anza.");
    document.getElementById("routeStatus").textContent="Njia: "+km+" km / "+min+" min";
    document.getElementById("routeStatus").className="badge ok";
    speak(VOICE_PROMPTS.route_ok+" Umbali kilomita "+km+".");
    if(currentPos)loadWeather(currentPos[0],currentPos[1]);
  }catch(e){
    setInstruction("Imeshindwa kupata njia. Angalia mtandao.");
    document.getElementById("routeStatus").textContent="Njia: imeshindwa";
    document.getElementById("routeStatus").className="badge danger";
  }
}

document.getElementById("btnNav").onclick=()=>{
  if(!routeSteps.length||!destination){setInstruction("Tengeneza njia kwanza.");return;}
  if(!navigator.geolocation){speak(VOICE_PROMPTS.gps_fail);return;}
  navigating=true; stepIndex=0; lastSpokenStep=-1;
  document.getElementById("btnStop").style.display="";
  document.getElementById("btnNav").style.display="none";
  document.getElementById("navStatus").textContent="Nav: INAENDELEA";
  document.getElementById("navStatus").className="badge ok";
  setInstruction(VOICE_PROMPTS.start_nav); speak(VOICE_PROMPTS.start_nav);
  if(routeSteps[0]){const first=maneuverSw(routeSteps[0]);setTimeout(()=>{setInstruction(first);speak(first);lastSpokenStep=0;},1200);}
  watchId=navigator.geolocation.watchPosition((pos)=>{
    currentPos=[pos.coords.latitude,pos.coords.longitude];
    placeUser(currentPos,pos.coords.accuracy);
    if(!navigating)return;
    const dDest=distM(currentPos,[destination.lat,destination.lng]);
    if(dDest<40){setInstruction(VOICE_PROMPTS.arrived);speak(VOICE_PROMPTS.arrived);stopNav();return;}
    if(dDest<120&&lastSpokenStep<9000){speak(VOICE_PROMPTS.near);lastSpokenStep=9000;}
    while(stepIndex<routeSteps.length-1){
      const st=routeSteps[stepIndex];
      const loc=st.maneuver&&st.maneuver.location?[st.maneuver.location[1],st.maneuver.location[0]]:null;
      if(!loc){stepIndex++;continue;}
      if(distM(currentPos,loc)<80){
        stepIndex++;
        if(stepIndex!==lastSpokenStep&&routeSteps[stepIndex]){
          const msg=maneuverSw(routeSteps[stepIndex]);
          setInstruction(msg); speak(msg); lastSpokenStep=stepIndex;
        }
      } else break;
    }
    if(hazardsOn){
      HAZARDS_DEMO.forEach(h=>{
        if(distM(currentPos,[h.lat,h.lng])<200&&!h._warned){
          h._warned=true; speak(h.voice||VOICE_PROMPTS.hazard);
          setInstruction("⚠️ "+h.name);
        }
      });
    }
  },()=>{document.getElementById("gpsStatus").textContent="GPS: dhaifu";document.getElementById("gpsStatus").className="badge warn";},
  {enableHighAccuracy:true,maximumAge:2000,timeout:10000});
};
document.getElementById("btnStop").onclick=()=>stopNav();
function stopNav(){
  navigating=false;
  if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  document.getElementById("btnStop").style.display="none";
  document.getElementById("btnNav").style.display="";
  document.getElementById("navStatus").textContent="Nav: imesimamishwa";
  document.getElementById("navStatus").className="badge";
  speak(VOICE_PROMPTS.stop);
}
document.getElementById("btnSpeak").onclick=()=>speak(lastInstruction);

document.getElementById("btnWeather").onclick=()=>{
  const ll=currentPos||(destination?[destination.lat,destination.lng]:[-6.7924,39.2083]);
  loadWeather(ll[0],ll[1],true);
};
async function loadWeather(lat,lng,announce){
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,precipitation&timezone=Africa%2FDar_es_Salaam`;
    const res=await fetch(url); const data=await res.json(); const c=data.current||{};
    const cond=weatherCodeSw(c.weather_code); const t=c.temperature_2m; const w=c.wind_speed_10m; const p=c.precipitation;
    const box=document.getElementById("weatherBox"); box.style.display="block";
    box.innerHTML=`<b>Hali ya hewa:</b> ${cond} · ${t}°C · Upepo ${w} km/h · Mvua ${p||0} mm`;
    document.getElementById("weatherBadge").textContent="Hewa: "+t+"°C · "+cond;
    document.getElementById("weatherBadge").className="badge info";
    if(c.weather_code>=65||(p&&p>5)){
      document.getElementById("weatherBadge").className="badge warn";
      if(announce)speak(VOICE_PROMPTS.weather_alert+" "+cond+". Kuwa makini.");
    } else if(announce) speak("Hali ya hewa: "+cond+", digrii "+Math.round(t));
  }catch(e){document.getElementById("weatherBadge").textContent="Hewa: haipatikani";}
}
function weatherCodeSw(code){
  if(code===0)return"Anga safi"; if(code<=3)return"Mawingu kidogo"; if(code<=48)return"Ukungu";
  if(code<=57)return"Manyunyu"; if(code<=67)return"Mvua"; if(code<=77)return"Theluji";
  if(code<=82)return"Mvua kubwa"; if(code<=99)return"Radi na radi"; return"Hali ya hewa";
}

document.getElementById("btnHazards").onclick=()=>{
  hazardsOn=!hazardsOn; hazardLayer.clearLayers();
  HAZARDS_DEMO.forEach(h=>{h._warned=false;});
  if(hazardsOn){
    HAZARDS_DEMO.forEach(h=>{
      const color=h.sev>=4?"#ef4444":h.sev>=3?"#f59e0b":"#fb923c";
      const m=L.circleMarker([h.lat,h.lng],{radius:11,color:color,fillColor:color,fillOpacity:0.75,weight:2}).bindPopup("<b>"+h.name+"</b><br/>"+h.type);
      m.addTo(hazardLayer); m.on("click",()=>speak(h.voice));
    });
    setInstruction("Hatari zimeonyeshwa. Bofya alama kusikia onyo.");
    speak("Tahadhari. Kuna hatari kwenye ramani.");
    document.getElementById("btnHazards").classList.add("on");
  } else {
    document.getElementById("btnHazards").classList.remove("on");
    setInstruction("Hatari zimefichwa.");
  }
};

document.getElementById("btnLive").onclick=()=>{
  liveOn=!liveOn; peopleLayer.clearLayers();
  if(peopleTimer){clearInterval(peopleTimer);peopleTimer=null;}
  if(!liveOn){document.getElementById("btnLive").classList.remove("on");setInstruction("Live watu: imefichwa.");return;}
  if(!routeCoords.length){setInstruction("Tengeneza njia kwanza.");liveOn=false;return;}
  document.getElementById("btnLive").classList.add("on");
  const people=[];
  for(let i=0;i<6;i++){
    const t=(i+1)/7; const idx=Math.floor(t*(routeCoords.length-1));
    const icon=L.divIcon({className:"person-dot",html:"<span></span>",iconSize:[14,14]});
    const mk=L.marker(routeCoords[idx],{icon}).addTo(peopleLayer).bindPopup("Mtu kwenye njia (live demo)");
    people.push({marker:mk,idx,dir:1});
  }
  peopleTimer=setInterval(()=>{
    people.forEach(p=>{
      p.idx+=p.dir*(1+Math.floor(Math.random()*3));
      if(p.idx>=routeCoords.length-1){p.idx=routeCoords.length-1;p.dir=-1;}
      if(p.idx<=0){p.idx=0;p.dir=1;}
      p.marker.setLatLng(routeCoords[p.idx]);
    });
  },900);
  setInstruction("Live: watu wakitembea kwenye njia. Zoom in kuona labels za mitaa.");
  speak("Unaona watu kwenye njia.");
};

/* Maelezo ya sauti kwa mtumiaji (badge inayobadilika) */
(function(){
  const b=document.getElementById("btnVoice");
  if(!window.speechSynthesis){ b.textContent="🚫 Sauti haiwezi"; b.disabled=true; return; }
  const check=()=>{ const vs=speechSynthesis.getVoices()||[]; const has=vs.some(v=>(v.lang||"").toLowerCase().startsWith("sw"));
    b.title=has?"Voice ya Kiswahili ipo — itasoma maelekezo":"Hakuna voice ya sw kwenye browser hii — itatumia voice nyingine"; };
  check(); if(speechSynthesis.onvoiceschanged!==undefined) speechSynthesis.onvoiceschanged=check;
})();
setTimeout(()=>speak(VOICE_PROMPTS.welcome),600);
