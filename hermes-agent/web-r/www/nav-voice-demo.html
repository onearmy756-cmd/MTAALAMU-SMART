<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MTAALAMU SMART — Navigation + Sauti</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --accent:#22c55e; --text:#f1f5f9; --muted:#94a3b8; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 1.5rem; }
    h1 { font-size: 1.35rem; margin: 0 0 0.5rem; }
    p { color: var(--muted); margin: 0 0 1.25rem; }
    .card { background: var(--card); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
    input, select, button {
      width: 100%; padding: 0.65rem 0.85rem; border-radius: 8px; border: 1px solid #334155;
      background: #0f172a; color: var(--text); font-size: 1rem; margin-bottom: 0.75rem;
    }
    button { background: var(--accent); color: #052e16; font-weight: 600; border: none; cursor: pointer; }
    button:active { opacity: 0.9; }
    button.secondary { background: #334155; color: var(--text); }
    #out { min-height: 3rem; font-size: 1.15rem; line-height: 1.5; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>🧭 MTAALAMU SMART — Navigation + Sauti</h1>
  <p>Maelekezo kwa Kiswahili + sauti (Web Speech API). Offline-friendly.</p>

  <div class="card">
    <label>Maelekezo (maneuver)</label>
    <select id="maneuver">
      <option value="turn-left">Pinda kushoto</option>
      <option value="turn-right">Pinda kulia</option>
      <option value="continue">Endelea moja kwa moja</option>
      <option value="roundabout">Mzunguko</option>
      <option value="arrive">Umefika</option>
      <option value="depart">Anza safari</option>
      <option value="uturn">Geuka nyuma</option>
    </select>
    <div class="row">
      <div>
        <label>Umbali (mita)</label>
        <input id="distance" type="number" value="200" min="0" step="50" />
      </div>
      <div>
        <label>Sehemu (hiari)</label>
        <input id="place" type="text" placeholder="mf. Kariakoo" />
      </div>
    </div>
    <button id="btnSpeak">🔊 Sema maelekezo</button>
    <button class="secondary" id="btnGps">📍 Mahali nilipo (GPS)</button>
  </div>

  <div class="card">
    <label>Maandishi yatakayosemwa</label>
    <div id="out">Chagua maneuver kisha bonyeza Sema.</div>
  </div>

  <script>
    const PROMPTS = {
      "turn-left": "Pinda kushoto.",
      "turn-right": "Pinda kulia.",
      "continue": "Endelea moja kwa moja.",
      "roundabout": "Ingia kwenye mzunguko.",
      "arrive": "Umefika sehemu unayoenda. Hongera.",
      "depart": "Safari imeanza. Fuata maelekezo.",
      "uturn": "Geuka nyuma."
    };

    function buildText() {
      const m = document.getElementById("maneuver").value;
      const d = Number(document.getElementById("distance").value) || 0;
      const place = document.getElementById("place").value.trim();
      let action = PROMPTS[m] || "Fuata barabara hii.";
      let prefix = "";
      if (d >= 1000) prefix = "Baada ya kilomita " + (d / 1000).toFixed(1) + ". ";
      else if (d > 0) prefix = "Baada ya mita " + Math.round(d) + ". ";
      if (m === "arrive" && place) action = "Umefika " + place + ". Hongera.";
      if (m === "depart" && place) action = "Safari imeanza kuelekea " + place + ".";
      return prefix + action;
    }

    function speak(text) {
      if (!window.speechSynthesis) {
        alert("Browser yako haiauni sauti (speechSynthesis).");
        return;
      }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "sw-TZ";
      u.rate = 0.95;
      // jaribu sauti ya Kiswahili kama ipo
      const voices = speechSynthesis.getVoices();
      const sw = voices.find(v => v.lang.startsWith("sw"));
      if (sw) u.voice = sw;
      speechSynthesis.speak(u);
    }

    document.getElementById("btnSpeak").onclick = () => {
      const t = buildText();
      document.getElementById("out").textContent = t;
      speak(t);
    };

    document.getElementById("btnGps").onclick = () => {
      if (!navigator.geolocation) {
        document.getElementById("out").textContent = "GPS haipatikani kwenye browser hii.";
        return;
      }
      document.getElementById("out").textContent = "Inatafuta mahali ulipo...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          const t = "Mahali ulipo limetambuliwa. Lat " + latitude.toFixed(5) +
            ", Lng " + longitude.toFixed(5) + ". Usahihi mita " + Math.round(accuracy) + ".";
          document.getElementById("out").textContent = t;
          speak("Mahali ulipo limetambuliwa.");
        },
        () => {
          document.getElementById("out").textContent = "Haikuweza kupata GPS. Ruhusu location.";
          speak("Ishara ya GPS imepotea. Subiri kidogo.");
        },
        { enableHighAccuracy: true, timeout: 12000 }
      );
    };

    // load voices (Chrome needs this)
    if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  </script>
</body>
</html>
