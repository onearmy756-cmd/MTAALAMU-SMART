<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MTECH OS — Dashboard</title>
<!--
  MTECH OS — BROWSER DASHBOARD (standalone)
  Tabs za mfumo: LIVE · AGENTIC VISION ·
  UTAMBUZI (BAYES) · VIZ · RAMANI (LIVE MAP kamili + map.js) · 3D · NAVIGATION ·
  FUNDI DEPLOY · FUNDI MOBILE · IOT + Mfumo.
  Bayes: posterior = prior × ∏ L(si) (kama bayes_causes kwenye eval.R).
-->
<link rel="stylesheet" href="dashboard.css"/>
<link rel="stylesheet" href="system.css"/>
<link rel="stylesheet" href="leaflet/leaflet.css"/>
<script src="leaflet/leaflet.js"></script>
<script src="map.js"></script>
<style>
:root{
  --bg:#04070d;--card:#0a1628;--card2:#0f2233;--line:rgba(0,229,255,.35);
  --cyan:#00e5ff;--green:#00ff88;--orange:#ffb300;--red:#ff3b3b;--purple:#b388ff;
  --text:#cfe9f5;--dim:#5e8aa3;
  --mono:'Share Tech Mono',ui-monospace,Consolas,monospace;
  --title:'Rajdhani',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh}
.dashboard{max-width:1280px;margin:0 auto;padding:0 12px 40px}
header.hud-header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 8px;border-bottom:1px solid var(--line)}
.hud-shield{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0f2233,#143048);border:1px solid var(--line);font-size:22px}
.hud-title{font-family:var(--title);font-size:1.25rem;letter-spacing:3px;color:#eafcff;text-shadow:0 0 12px rgba(0,229,255,.5)}
.hud-sub{font-size:.72rem;color:var(--dim)}
.hud-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:.3rem .6rem;border-radius:999px;
  font-size:.7rem;border:1px solid var(--line);background:var(--card2)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.pill.green{color:var(--green);border-color:rgba(0,255,136,.4)}
.pill.secure{color:var(--cyan)}
.lang-box select{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:.3rem .5rem;font-family:var(--mono)}
/* TABS */
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0;position:sticky;top:0;z-index:20;
  background:rgba(4,7,13,.92);backdrop-filter:blur(4px)}
nav.tabs button{padding:.5rem .8rem;border-radius:8px;border:1px solid var(--line);cursor:pointer;
  background:var(--card2);color:var(--cyan);font-family:var(--mono);font-size:.74rem;font-weight:700;letter-spacing:.5px}
nav.tabs button:hover{background:#143048}
nav.tabs button.on{background:rgba(0,229,255,.16);color:var(--green);border-color:var(--green);box-shadow:0 0 12px rgba(0,255,136,.15)}
/* PANELS */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:.8rem 1rem;border-bottom:1px solid rgba(0,229,255,.18)}
.panel-head h2{font-family:var(--title);font-size:1rem;letter-spacing:2px;color:#eafcff}
.panel-head .meta{font-size:.68rem;color:var(--dim);margin-left:auto}
.panel-body{padding:1rem}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:var(--card2);border:1px solid rgba(0,229,255,.22);border-radius:10px;padding:.8rem}
.card h3{font-family:var(--title);font-size:.82rem;letter-spacing:1px;color:var(--cyan);margin-bottom:.5rem}
.badge{display:inline-block;padding:.12rem .45rem;border-radius:4px;font-size:.64rem;border:1px solid var(--line);color:var(--dim);background:#12263c}
.badge.ok{color:var(--green);border-color:rgba(0,255,136,.5)}
.badge.warn{color:var(--orange);border-color:rgba(255,179,0,.5)}
.badge.danger{color:var(--red);border-color:rgba(255,59,59,.55)}
.badge.info{color:var(--cyan)}
/* GAUGES */
.gauge{position:relative;width:120px;height:120px;margin:0 auto}
.gauge svg{transform:rotate(-90deg)}
.gauge .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .val b{font-size:1.3rem;color:var(--cyan)}
.gauge .val span{font-size:.6rem;color:var(--dim)}
.bar{height:8px;border-radius:4px;background:#0d1b2e;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--cyan)}
/* FLOW / PIPELINE */
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flow .step{background:var(--card2);border:1px solid rgba(0,229,255,.3);border-radius:8px;padding:.5rem .7rem;font-size:.68rem;min-width:120px}
.flow .step b{display:block;color:var(--cyan);font-size:.72rem}
.flow .arr{color:var(--dim)}
.flow .step.done{border-color:var(--green);color:var(--green)}
.flow .step.run{border-color:var(--orange);box-shadow:0 0 10px rgba(255,179,0,.3)}
/* HESABU */
.trade-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.trade-pills button{padding:.3rem .6rem;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer;font-size:.68rem;font-family:var(--mono)}
.trade-pills button.on{background:rgba(0,255,136,.14);color:var(--green);border-color:var(--green)}
.f-list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto}
.f-item{padding:.55rem .7rem;border:1px solid rgba(0,229,255,.2);border-radius:8px;cursor:pointer;background:var(--card2);font-size:.74rem}
.f-item:hover{border-color:var(--cyan)}
.f-item.on{border-color:var(--green);background:rgba(0,255,136,.07)}
.f-item b{color:#eafcff}
.f-item .fx{color:var(--dim);font-size:.68rem;margin-top:2px}
.inp{display:flex;flex-direction:column;gap:2px;font-size:.7rem}
.inp label{color:var(--dim)}
.inp input,.inp select{background:#0d1b2e;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:.4rem .5rem;font-family:var(--mono)}
.result{background:#0d1b2e;border:1px solid rgba(0,255,136,.35);border-radius:10px;padding:.8rem;margin-top:10px}
.result .big{font-size:1.4rem;color:var(--green);font-family:var(--title)}
.steps{margin-top:.6rem;font-size:.72rem;color:var(--text)}
.steps li{margin-left:16px;margin-bottom:2px}
/* TABLES */
table{width:100%;border-collapse:collapse;font-size:.72rem}
th,td{padding:.45rem .5rem;border-bottom:1px solid rgba(0,229,255,.12);text-align:left}
th{color:var(--cyan);font-family:var(--title);letter-spacing:1px;font-size:.7rem}
tr:hover td{background:rgba(0,229,255,.05)}
/* TOPOLOGY SVG */
.topo{background:#0d1b2e;border:1px solid rgba(0,229,255,.2);border-radius:10px}
/* SVG CHART */
.chart-wrap{background:#0d1b2e;border:1px solid rgba(0,229,255,.2);border-radius:10px;padding:.5rem}
/* MOBILE PROBLEM */
.mprob{padding:.5rem .6rem;border-bottom:1px solid rgba(0,229,255,.1);font-size:.72rem}
.mprob b{color:#eafcff}
.mprob .sol{color:var(--dim);margin-top:3px;white-space:pre-line}
/* IOT */
.vert{display:flex;gap:10px;align-items:flex-start;padding:.7rem;border:1px solid rgba(0,229,255,.2);border-radius:10px;background:var(--card2)}
.vert .ico{font-size:1.4rem}
/* MAP (kama Shiny — map.js inasoma vipengele hivi) */
.tzmap{height:560px;width:100%;border:1px solid rgba(0,229,255,.25);border-radius:10px;background:#04070d}
.map-bar{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;background:var(--card2);
  border:1px solid rgba(0,229,255,.2);border-radius:10px;padding:.7rem .8rem;margin-bottom:10px}
.map-ctl{display:flex;flex-direction:column;gap:4px;min-width:180px}
.map-ctl>label{font-size:.64rem;color:var(--cyan);letter-spacing:1px;font-family:var(--title)}
.map-ctl select,.map-ctl input[type=text]{background:#0d1b2e;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:.35rem .5rem;font-family:var(--mono);font-size:.72rem}
.ov-box{display:flex;flex-direction:column;gap:3px;max-height:150px;overflow-y:auto;background:#0d1b2e;border:1px solid rgba(0,229,255,.2);border-radius:6px;padding:.4rem .5rem}
.ov-item{display:flex;gap:6px;align-items:center;font-size:.68rem;color:var(--text);cursor:pointer}
.route-row{display:flex;gap:6px;align-items:center}
.route-arrow{color:var(--dim)}
.map-go{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--cyan);padding:.35rem .5rem;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:.68rem;font-weight:700}
.map-go:hover{background:#143048}
.map-under{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:.66rem;color:var(--dim)}
.map-legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.map-legend .lg{display:inline-flex;gap:4px;align-items:center}
.map-license{font-size:.6rem;line-height:1.5;opacity:.85}
/* STATUS BAR */
footer.statusbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:.7rem 1rem;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:.7rem;color:var(--dim)}
.empty{color:var(--dim);font-size:.74rem;font-style:italic;padding:.6rem}
a.cyan{color:var(--cyan)}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--cyan);padding:.4rem .7rem;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:.72rem;font-weight:700}
.btn:hover{background:#143048}
iframe.embed{width:100%;height:72vh;border:1px solid rgba(0,229,255,.2);border-radius:12px;background:#04070d}
/* ===== DESKTOP-MIRROR: agentic / fundi-deploy / fundi-mobile (madarasa ya dashboard.css) ===== */
.scribe-strip{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.scribe-card{min-width:210px;max-width:210px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card2);flex-shrink:0}
.scribe-card .sc-h{font-weight:700;font-size:.72rem}
.scribe-card .sc-n{font-size:.7rem;color:var(--text);margin-top:4px;min-height:44px}
.scribe-card .sc-v{font-size:.64rem;color:var(--dim);margin-top:4px}
.scribe-card .sc-vis{font-size:.6rem;color:var(--dim);margin-top:2px}
.agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.agent-card{border:1px solid rgba(0,229,255,.2);border-radius:8px;padding:10px;background:var(--card2)}
.bus-chip{border:1px solid rgba(0,229,255,.2);border-radius:6px;padding:8px 12px;background:var(--card2)}
.wiring-svg{background:#050d18;border-radius:8px;border:1px solid rgba(0,229,255,.15)}
.fundi-host{display:flex;gap:8px;align-items:center;padding:.35rem 0;font-size:.74rem;border-bottom:1px solid rgba(0,229,255,.08);flex-wrap:wrap}
.gov-field{margin-top:6px}
.gov-field label{font-size:.68rem;color:var(--dim);display:block}
.gov-field input,.gov-field select{width:100%;background:#0d1b2e;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:.4rem .5rem;font-family:var(--mono)}
.mono-out{background:#050d18;border:1px solid rgba(0,229,255,.2);border-radius:8px;padding:.7rem;font-size:.72rem;color:#b2ebf2;white-space:pre-wrap;max-height:340px;overflow:auto;margin-top:8px}
details.mprob-d{margin:4px 0;border-left:2px solid #0e7490;padding-left:8px}
details.mprob-d summary{font-size:.72rem;cursor:pointer;color:var(--text)}
details.mprob-d .sol{font-size:.68rem;color:#b2ebf2;margin-top:4px;white-space:pre-line}
details.mprob-d .min{font-size:.62rem;color:var(--dim);margin-top:3px}
.av-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
textarea.av-msg{width:100%;min-height:64px;background:#0a1628;color:#e0f7fa;border:1px solid rgba(0,229,255,.3);border-radius:8px;padding:.5rem;font-family:var(--mono);font-size:.78rem;resize:vertical}
.inp input{width:100%}
.grid-bottom{margin-top:12px}
/* ===== STUDIO — mazingira ya kazi (kama Adobe/AI-studio) ===== */
.studio{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.studio-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:.6rem .9rem;border-bottom:1px solid rgba(0,229,255,.2);background:linear-gradient(90deg,rgba(0,40,60,.5),rgba(10,22,40,.2))}
.st-brand{font-family:var(--title);letter-spacing:2px;color:#eafcff;font-size:1rem}
.st-brand .meta{margin-left:6px}
.st-pills{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.studio-body{display:grid;grid-template-columns:150px 1fr 250px;min-height:60vh}
@media (max-width:900px){.studio-body{grid-template-columns:56px 1fr}.studio-insp{display:none}}
.studio-rail{border-right:1px solid rgba(0,229,255,.18);background:#081420;padding:.6rem .4rem;display:flex;flex-direction:column;gap:4px}
.studio-rail button{display:flex;gap:8px;align-items:center;padding:.5rem .5rem;border:1px solid transparent;border-radius:8px;background:none;color:var(--dim);cursor:pointer;font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:.5px;text-align:left}
.studio-rail button:hover{background:#0f2233;color:var(--text)}
.studio-rail button.on{background:rgba(0,229,255,.14);color:var(--green);border-color:var(--green)}
.studio-rail .rail-sep{height:1px;background:rgba(0,229,255,.12);margin:.4rem .2rem}
.studio-canvas{padding:.9rem;overflow:auto;max-height:78vh;display:flex;flex-direction:column;gap:12px}
.studio-insp{border-left:1px solid rgba(0,229,255,.18);background:#081420;padding:.8rem;overflow:auto;max-height:78vh}
.studio-insp h4{font-family:var(--title);color:var(--cyan);font-size:.8rem;letter-spacing:1px;margin-bottom:.5rem}
.studio-status{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:.5rem .9rem;border-top:1px solid rgba(0,229,255,.2);font-size:.66rem;color:var(--dim)}
.sdot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#3a4a5a;box-shadow:0 0 0 2px rgba(255,255,255,.04)}
.sdot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
.sdot.danger{background:var(--red);box-shadow:0 0 8px var(--red)}
.pipe-tl{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:8px}
.ptl-step{display:flex;flex-direction:column;gap:2px;min-width:104px;background:#0a1628;border:1px solid rgba(0,229,255,.25);border-radius:8px;padding:.45rem .55rem;font-size:.62rem;color:var(--dim)}
.ptl-step b{color:var(--cyan);font-size:.68rem}
.ptl-step .ptl-dot{position:absolute}
.ptl-step.done{border-color:var(--green);color:var(--green)}
.ptl-step.done b{color:var(--green)}
.ptl-step.run{border-color:var(--orange);box-shadow:0 0 10px rgba(255,179,0,.35)}
.ptl-step.gate{border-style:dashed;border-color:var(--orange)}
.ptl-link{color:var(--dim);font-size:.7rem}
.agent-card.sel{border-color:var(--green);box-shadow:0 0 10px rgba(0,255,136,.25)}
.up-card{border:1px solid rgba(0,229,255,.2);border-radius:10px;background:var(--card2);padding:.8rem}
.up-tree{font-family:var(--mono);font-size:.64rem;color:var(--dim);background:#050d18;border-radius:6px;padding:.5rem .6rem;margin-top:.5rem;max-height:150px;overflow:auto}
.viz-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
</style>
</head>
<body>
<div class="dashboard">
  <header class="hud-header">
    <div class="hud-shield">🔐</div>
    <div>
      <div class="hud-title" id="hudTitle">MTECH OS</div>
      <div class="hud-sub" id="hudSub">Mfumo Mahiri wa MTECH OS</div>
    </div>
    <div class="hud-right">
      <span class="pill green"><span class="dot"></span><span id="pillOnline">MTANDO: HAI</span></span>
      <span class="pill secure">🔒 SECURE</span>
      <span class="lang-box">
        <select id="langSel">
          <option value="sw">🇹🇿 Kiswahili</option>
          <option value="en">🇬🇧 English</option>
        </select>
      </span>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>

  <footer class="statusbar">
    <span>⚙️ <b id="sbEngine">MTECH OS</b></span>
    <span>📅 <span id="sbDate">—</span></span>
    <span>🕐 <span id="sbClock">—</span></span>
    <span>📊 formulas: <b id="sbFormulas">—</b></span>
    <span>🧠 models: <b id="sbModels">—</b></span>
    <span>🛠️ skills: <b id="sbSkills">—</b></span>
    <span>🗺️ regions: <b id="sbRegions">—</b></span>
    <span style="margin-left:auto">
      <a class="cyan" href="ramani-3d.html">🌍 Ramani 3D</a> ·
      <a class="cyan" href="ramani-nav.html">🧭 Navigation</a>
    </span>
  </footer>
</div>

<script>
"use strict";
/* ============================================================
 * MTAALAMU SMART — DASHBOARD ENGINE (browser, offline-first)
 * MTECH OS — huduma za ndani pekee.
 * ============================================================ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n).toLocaleString("en-US");
const fmtTZS = (n) => "TZS " + fmt(Math.round(n));

let LANG = localStorage.getItem("mt_lang") || "sw";
let D = {};               /* data zote */
let TAB = "studio";
let S = {
  fxTrade: "all", fxId: null, fxResult: null,
  diagModel: null, diagOn: [],
  /* AGENTIC VISION (kama agentic.R — session PIITVD + scribe + kitabu) */
  av: { state: "created", idx: 0, frames: [], timer: null, msg: "", startedAt: null },
  /* FUNDI DEPLOY (kama fundi.R — API client + HITL) */
  fundi: { api: localStorage.getItem("mt_fundi_api") || "http://127.0.0.1:8080",
           summary: undefined, hosts: null, jobs: null, extra: null, targets: [], note: "" },
  /* FUNDI MOBILE (kama mobile.R — outputs za panels) */
  mob: { devicesOut: null, runOut: null, shieldOut: null, govOut: null, govFields: [], govSys: null,
         sysOut: null, mlzOut: null, advOut: null, recoverOut: null, consentOut: null,
         telCompute: null, telOut: null },
  /* STUDIO — mazingira ya kazi (HERMES msimamizi) */
  studio: { tool: "hermes", sel: "", probes: {}, ollamaModels: null, upstream: null,
            pipe: "iot_incident", idx: -1, frames: [], gate: null, running: false, timer: null, viz: "revenue" }
};

/* ---------- FETCH ZOTE (data halisi ya mradi) ---------- */
async function getJSON(url) { try { const r = await fetch(url); if (!r.ok) return null; return await r.json(); } catch (e) { return null; } }
async function getTEXT(url) { try { const r = await fetch(url); if (!r.ok) return null; return await r.text(); } catch (e) { return null; } }
async function loadAll() {
  const jobs = {
    formulas:   "../../data/formulas.json",
    diagnosis:  "../data/diagnosis.json",
    agentData:  "../data/agent_data.json",
    agents10:   "../../data/agents/agents_10.json",
    skills:     "../../data/skills/skills.json",
    trades:     "../../data/trades.json",
    problems:   "../../data/problems.json",
    geo:        "../data/geo.json",
    iotDevices: "../../data/iot/devices.json",
    iotHermes:  "../../data/iot/hermes.json",
    iotVerticals:"../../data/iot/verticals.json",
    iotAgentsOss:"../../data/iot/agents_oss.json",
    iotRegHome: "../../data/iot/registry/nyumbani.json",
    iotRegAfya: "../../data/iot/registry/afya.json",
    iotRegUsalama:"../../data/iot/registry/usalama.json",
    iotRegKilimo:"../../data/iot/registry/kilimo.json",
    deployBundles:"../../data/deploy/app_bundles.json",
    mobileServices: "../../data/mobile/services.json",
    mobileProblems: "../../data/mobile/phone_problems.json",
    professions: "../../data/professions.json",
    pricing:    "../../data/pricing.json",
    config:     "../../data/config.json",
    /* AGENTIC VISION (agentic.R: data/vision/*.json) */
    visionPipeline: "../../data/vision/pipeline.json",
    deviceMap:      "../../data/vision/device_map.json",
    sysBus:         "../../data/vision/system_bus.json",
    solvePolicy:    "../../data/vision/solve_policy.json",
    reportTpl:      "../../data/vision/report_template.json",
    voiceScripts:   "../../data/vision/voice_scripts_sw.json",

/* ============================================================
 * Kikokotoo cha ndani — evaluator salama
 * func: sqrt pow ceil floor abs log exp min max if ; pi
 * ============================================================ */
function evalExpr(expr, vars) {
  const CONSTS = (D.formulas && D.formulas.constants) || {};
  const names = Object.keys(vars), vals = names.map((k) => vars[k]);
  names.push("pi", "e"); vals.push(Math.PI, Math.E);
  for (const [k, v] of Object.entries(CONSTS)) { names.push(k); vals.push(v); }
  const FN = { sqrt: Math.sqrt, pow: Math.pow, ceil: Math.ceil, floor: Math.floor, abs: Math.abs,
               log: Math.log, exp: Math.exp, min: Math.min, max: Math.max,
               if: (c, a, b) => (c ? a : b) };
  let i = 0; const s = expr;
  function ws() { while (i < s.length && /\s/.test(s[i])) i++; }
  function num() {
    ws();
    if (s[i] === "(") { i++; const v = or(); ws(); if (s[i] === ")") i++; return v; }
    if (s[i] === "-") { i++; return -num(); }
    if (s[i] === "+") { i++; return num(); }
    if (s.startsWith("pi", i) && !/[a-zA-Z0-9_]/.test(s[i + 2] || "")) { i += 2; return Math.PI; }
    /* function calls: sqrt( pow( ceil( floor( abs( log( exp( min( max( if( */
    for (const fname of Object.keys(FN)) {
      if (s.startsWith(fname + "(", i)) {
        i += fname.length + 1;
        const args = [or()];
        for (;;) { ws(); if (s[i] === ",") { i++; args.push(or()); } else break; }
        ws(); if (s[i] === ")") i++;
        return FN[fname].apply(null, args);
      }
    }
    const m = /^[0-9]*\.?[0-9]+([eE][+-]?[0-9]+)?/.exec(s.slice(i));
    if (m) { i += m[0].length; return parseFloat(m[0]); }
    for (const n of names) if (s.startsWith(n, i) && !/[a-zA-Z0-9_]/.test(s[i + n.length] || "")) { i += n.length; return vals[names.indexOf(n)]; }
    throw new Error("bad token @" + i);
  }
  function powr() { let v = num(); ws(); if (s[i] === "^") { i++; return Math.pow(v, powr()); } return v; }
  function mul() { let v = powr(); for (;;) { ws(); if (s[i] === "*") { i++; v *= powr(); } else if (s[i] === "/") { i++; v /= powr(); } else if (s[i] === "%") { i++; v %= powr(); } else return v; } }
  function add() { let v = mul(); for (;;) { ws(); if (s[i] === "+") { i++; v += mul(); } else if (s[i] === "-") { i++; v -= mul(); } else return v; } }
  function cmp() { let v = add(); for (;;) { ws(); if (s.startsWith("<=", i)) { i += 2; v = v <= add() ? 1 : 0; } else if (s.startsWith(">=", i)) { i += 2; v = v >= add() ? 1 : 0; } else if (s[i] === "<") { i++; v = v < add() ? 1 : 0; } else if (s[i] === ">") { i++; v = v > add() ? 1 : 0; } else return v; } }
  function eq() { let v = cmp(); for (;;) { ws(); if (s.startsWith("==", i)) { i += 2; v = v === add() ? 1 : 0; } else if (s.startsWith("!=", i)) { i += 2; v = v !== add() ? 1 : 0; } else return v; } }
  function and() { let v = eq(); for (;;) { ws(); if (s.startsWith("&&", i)) { i += 2; v = (v && eq()) ? 1 : 0; } else return v; } }
  function or()  { let v = and(); for (;;) { ws(); if (s.startsWith("||", i)) { i += 2; v = (v || and()) ? 1 : 0; } else return v; } }
  return or();
}
function calcFormula(f, inputVals) {
  const vars = {};
  (f.inputs || []).forEach((inp) => {
    const v = inputVals[inp.name];
    vars[inp.name] = (v == null || v === "" || isNaN(Number(v))) ? inp.default : Number(v);
  });
  const outputs = (f.outputs || []).map((o) => {
    let raw = null, err = null;
    try { raw = evalExpr(o.expr, vars); vars[o.name] = raw; } catch (e) { err = e.message; }
    const digits = o.digits == null ? 2 : o.digits;
    return { name: o.name, label: o.label, unit: o.unit || "", err,
             value: raw == null ? null : Math.round(raw * Math.pow(10, digits)) / Math.pow(10, digits) };
  });
  const steps = (f.steps || []).map((st) => {
    if (st.text) return { label: st.label, text: st.text };
    try {
      const v = evalExpr(st.expr, vars);
      const num = Math.round(v * 100) / 100;
      return { label: st.label, text: (st.template || "{{result}}").replace("{{result}}", fmt(num)) };
    } catch (e) { return { label: st.label, text: "—" }; }
  });
  let status = "INFO", msg = { sw: "", en: "" };
  (f.rules || []).some((r) => {
    const cvars = Object.assign({}, vars);
    outputs.forEach((o) => { if (o.value != null) cvars[o.name] = o.value; });
    const chk = r.check.replace(/\btrue\b/gi, "1").replace(/\bfalse\b/gi, "0");
    let ok = false;
    try { ok = !!evalExpr(chk, cvars); } catch (e) { ok = false; }
    if (ok) { status = r.status; msg = r.msg || { sw: "", en: "" }; return true; }
    return false;
  });
  return { outputs, steps, status, msg };
}

/* ---------- BAYES (kama bayes_causes kwenye eval.R) ---------- */
function bayesCauses(model, on) {
  const rows = (model.causes || []).map((c) => {
    let p = c.prior || 0.1;
    (model.symptoms || []).forEach((s) => {
      const lik = (s.likelihood && s.likelihood[c.id] != null) ? s.likelihood[c.id] : 0.2;
      p *= on.includes(s.id) ? lik : (1 - lik);
    });
    return { id: c.id, name: c.name, fix: c.fix, cost_tzs: c.cost_tzs, prob: p };
  });
  const total = rows.reduce((a, r) => a + r.prob, 0) || 1;
  rows.forEach((r) => r.pct = Math.round((r.prob / total) * 1000) / 10);
  return rows.sort((a, b) => b.pct - a.pct);
}

function mountMap() {

  let node = $("tz-geo");
  if (!node) {
    node = document.createElement("script");

  }
  node.textContent = JSON.stringify({ data: geo, labels: MAP_LABELS_SW });
  try { MTMap.init(); } catch (e) { console.warn("MTMap.init", e); }
}

/* ---------- TAB: FUNDI DEPLOY — kama fundi.R (API client + HITL + jobs) ---------- */
async function fundiGet(path, timeout) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), (timeout || 6) * 1000);
  try {
    const r = await fetch(S.fundi.api.replace(/\/$/, "") + path, { signal: ctl.signal });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; } finally { clearTimeout(t); }
}
async function fundiPost(path, body) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 6000);
  try {
    const r = await fetch(S.fundi.api.replace(/\/$/, "") + path, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}), signal: ctl.signal });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; } finally { clearTimeout(t); }
}
async function fundiPollSummary() {
  S.fundi.summary = await fundiGet("/supervisor/summary");
  if (TAB === "fundi") renderAll();
}
async function fundiDiscover() {
  S.fundi.hosts = await fundiGet("/computers");
  S.fundi.note = "";
  if (TAB === "fundi") renderAll();
}
async function fundiRefresh() {
  const [jobs, imgs, sel, ag, cld, bks, prof] = await Promise.all([
    fundiGet("/jobs"), fundiGet("/images"),
    fundiPost("/os/select", { specs: "16gb ram 8 cores 512 ssd", user_need: "office" }),
    fundiGet("/agents"), fundiGet("/cloud/status"), fundiGet("/backups"), fundiGet("/os/profiles")
  ]);
  S.fundi.jobs = jobs;
  S.fundi.extra = { imgs, sel, ag, cld, bks, prof };
  if (TAB === "fundi") renderAll();
}
async function fundiDeploy() {
  if (!S.fundi.targets.length) { S.fundi.note = "empty"; renderAll(); return; }
  const computers = S.fundi.targets.map((m) => ({ mac: m, name: "PC-" + m }));
  const res = await fundiPost("/deploy", { computers, os_type: "auto", auto_approve: false });
  S.fundi.note = res ? ("Jobs " + (((res.job_ids) || []).length) + " — zinasubiri RUHUSU (HITL)") : "Deploy imeshindikana — API offline";
  if (TAB === "fundi") renderAll();
}

function telecomCalc(compute, argsStr) {
  const args = {};
  (argsStr || "").split(/[\s;]+/).filter(Boolean).forEach((tok, i, arr) => { if (tok.startsWith("--")) args[tok.slice(2)] = arr[i + 1]; });
  const num = (k, d) => { const v = parseFloat(args[k] != null ? args[k] : ""); return isNaN(v) ? d : v; };
  const r = (v, d) => Math.round(v * Math.pow(10, d == null ? 2 : d)) / Math.pow(10, d == null ? 2 : d);
  const out = [];
  switch (compute) {
    case "dbm_to_mw": out.push(["P_mW", r(Math.pow(10, num("dbm", 20) / 10), 3), "mW"]); break;
    case "mw_to_dbm": out.push(["dBm", r(10 * Math.log10(num("mw", 100)), 2), "dBm"]); break;
    case "noise_floor": out.push(["NF", r(-174 + 10 * Math.log10(num("bw_hz", 20000000)) + num("nf", 5), 1), "dBm"]); break;
    case "snr": out.push(["SNR", r(num("signal_dbm", -60) - num("noise_dbm", -95), 1), "dB"]); break;
    case "fspl": out.push(["FSPL", r(32.45 + 20 * Math.log10(num("d_km", 5)) + 20 * Math.log10(num("f_mhz", 2400)), 1), "dB"]); break;
    case "eirp": out.push(["EIRP", r(num("p_tx", 20) + num("g_tx", 15) - num("l_cable", 2), 1), "dBm"]); break;
    case "rsl": out.push(["RSL", r(num("eirp_dbm", 33) + num("g_rx", 15) - num("fspl_db", 114) - num("l_rx", 2), 1), "dBm"]); break;
    case "link_margin": out.push(["Margin", r(num("rsl_dbm", -68) - num("sens_dbm", -85), 1), "dB"]); break;
    case "fresnel": out.push(["radius", r(17.32 * Math.sqrt(Math.max(0.0001, num("d1_km", 2) * num("d2_km", 3) / (num("f_ghz", 5.8) * num("d_km", 5)))), 2), "m"]); break;
    case "wavelength": out.push(["λ", r(300 / num("f_mhz", 2400), 3), "m"]); break;
    case "dish_gain": out.push(["G", r(10 * Math.log10(Math.max(1e-9, num("eff", 0.6) * Math.pow(Math.PI * num("d_m", 1.2) / (300 / num("f_mhz", 5800)), 2))), 1), "dBi"]); break;
    case "shannon": out.push(["C", r(num("bw_mhz", 20) * Math.log2(1 + Math.pow(10, num("snr_db", 20) / 10)), 1), "Mbps"]); break;
    case "ofdm_subcarriers": out.push(["N", r(num("bw_khz", 20000) / num("df_khz", 15), 0), "subcarriers"]); break;
    case "mimo": out.push(["C", r(num("bw_mhz", 20) * Math.min(2, num("streams", 2)) * Math.log2(1 + Math.pow(10, num("snr_db", 20) / 10) / Math.max(1, num("streams", 2))), 1), "Mbps"]); break;
    case "erlangs": out.push(["A", r(num("calls_per_hour", 100) * num("call_min", 3) / 60, 2), "Erlang"]); break;
    case "erlang_b": {
      const A = num("erlangs", 5), N = Math.max(1, Math.round(num("channels", 10)));
      let b = 1; for (let n = 1; n <= N; n++) b = (A * b) / (n + A * b);
      out.push(["B", r(b * 100, 2), "%"]); break;
    }
    case "trunk_util": out.push(["U", r(num("erlangs", 5) / num("channels", 10) * 100, 1), "%"]); break;
    case "subnet": {
      const ip = (args.ip || "192.168.1.100").split(".").map((x) => parseInt(x, 10) & 255);
      const cidr = Math.max(0, Math.min(32, Math.round(num("cidr", 24))));
      const mask = cidr === 0 ? 0 : (~((1 << (32 - cidr)) - 1)) >>> 0;
      const ipInt = ((ip[0] << 24) | (ip[1] << 16) | (ip[2] << 8) | ip[3]) >>> 0;
      const net = (ipInt & mask) >>> 0, bc = (net | (~mask >>> 0)) >>> 0;
      const fmtI = (n) => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join(".");
      out.push(["Network", fmtI(net) + "/" + cidr, ""]); out.push(["Broadcast", fmtI(bc), ""]); out.push(["Hosts", fmt(Math.pow(2, 32 - cidr) - 2), ""]); break;
    }
    case "bdp": case "tcp_window": out.push(["BDP", r(num("bw_mbps", compute === "bdp" ? 100 : 1000) * 1e6 * (num("rtt_ms", compute === "bdp" ? 50 : 100) / 1000) / 8 / 1024, 1), "KB"]); break;
    case "bw_per_user": out.push(["BW/user", r(num("total_mbps", 1000) / Math.max(1, num("users", 100)), 2), "Mbps"]); break;
    case "capacity_plan": out.push(["Required", r(num("users", 1000) * num("bw_user_mbps", 5) * num("util", 0.7), 1), "Mbps"]); break;
    case "prop_delay": out.push(["t", r(num("d_km", 1000) / 200000 * 1000, 2), "ms"]); break;
    case "mos": { const R = num("r_factor", 90); out.push(["MOS", r(1 + 0.035 * R + 7e-6 * R * (R - 60) * (100 - R), 2), ""]); break; }
    case "fiber_budget": out.push(["L_max", r((num("p_tx_dbm", 0) - num("sens_dbm", -28) - num("margin_db", 3)) / num("att_dbkm", 0.35), 2), "km"]); break;
    case "fiber_loss": out.push(["Loss", r(num("att_dbkm", 0.35) * num("len_km", 10) + num("splices", 4) * 0.1 + num("connectors", 2) * 0.5, 2), "dB"]); break;
    default: out.push(["—", "", ""]); break;
  }
  return out.map(([k, v, u]) => k + " = " + v + (u ? " " + u : "")).join("\n");
}

function fxLive(inp) {
  S.fxVals = S.fxVals || {};
  const fid = (S.fxId || ((((D.formulas || {}).formulas) || []).filter((f) => S.fxTrade === "all" || f.trade === S.fxTrade)[0] || {}).id);
  if (!fid) return;
  S.fxVals[fid] = S.fxVals[fid] || {};
  S.fxVals[fid][inp.dataset.fxInp] = inp.value;
  const card = inp.closest(".card");
  const res = calcFormula(((D.formulas || {}).formulas || []).find((f) => f.id === fid), S.fxVals[fid]);
  const resEl = card.querySelector(".result");
  if (resEl) {
    resEl.innerHTML = res.outputs.map((o) => `<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">
      <span style="color:var(--dim);font-size:.72rem">${bi(o.label)}</span>
      <span class="big">${o.err ? "—" : fmt(o.value)} <small>${esc(o.unit)}</small></span></div>`).join("") +
      `<div style="margin-top:.4rem">${statusBadge(res.status)} <span style="font-size:.72rem">${bi(res.msg)}</span></div>` +
      (res.steps.length ? `<ol class="steps">${res.steps.map((st) => `<li><span style="color:var(--dim)">${esc(st.label || "")}:</span> ${esc(st.text)}</li>`).join("")}</ol>` : "");
  }
}

  else if (a === "approve") avApprove();
  else if (a === "scan") avScan();

  else if (a === "wiring") renderAll();
  else if (a === "speak") avSpeak();
  else if (a === "book") downloadKitabu();
}
function fundiAction(a) {
  if (a === "discover") fundiDiscover();
  else if (a === "deploy") fundiDeploy();
  else if (a === "refresh") fundiRefresh();
}
function mobSet(slot, text, cls, pre) { S.mob[slot] = { text, cls: cls || "INFO", pre: !!pre }; renderAll(); }
function mobAction(name) {
  const sw = LANG === "sw";
  const bin = mobBinaryBanner();
  if (name === "refresh") {
    (async () => {
      D.mobJobs = await getJSON("../../data/mobile/jobs.json");
      D.mobConsents = await getJSON("../../data/mobile/consents.json");
      D.mobJobsArr = Array.isArray(D.mobJobs) ? D.mobJobs : [];
      D.mobConsentsArr = Array.isArray(D.mobConsents) ? D.mobConsents : [];
      renderAll();
    })();
    return;
  }
  if (name === "devices") { mobSet("devicesOut", bin, "FAIL"); return; }
  if (name === "consentform") {
    if (D.consentFormTxt) { S.mob.consentOut = { text: D.consentFormTxt, cls: "INFO", pre: true }; renderAll(); }
    else mobSet("consentOut", bin, "FAIL");
    return;
  }
  if (name === "run" || name === "consentadd") { mobSet("runOut", bin, "FAIL"); return; }
  if (name === "recover") { mobSet("recoverOut", bin, "FAIL"); return; }
  if (name.indexOf("shield-") === 0) { mobSet("shieldOut", bin, "FAIL"); return; }
  if (name === "gov-load") {
    const systems = ((D.mobGov || {}).systems) || [];
    const sel = $("gov_system");
    const s = systems.find((x) => x.id === (sel ? sel.value : ""));
    S.mob.govSys = s || null;
    S.mob.govFields = (s && s.fields) || [];
    renderAll();
    return;
  }
  if (name === "gov-fill") {
    const s = S.mob.govSys;
    if (!s) { mobSet("govOut", sw ? "Chagua mfumo kisha 'Fungua fields' kwanza." : "Pick a system and 'Open fields' first.", "WARNING"); return; }
    const answers = Array.from(document.querySelectorAll("[data-gf]")).map((el) => { const v = (el.value || "").trim(); return v ? el.dataset.gf + "=" + v : null; }).filter(Boolean);
    const text = (sw ? "FOMU: " : "FORM: ") + s.name + " (TZS " + fmt(s.fee_tzs || 0) + ", " + (s.minutes || "?") + " min)\n\n" +
      (sw ? "HATUA HALISI:\n" : "REAL STEPS:\n") + (s.steps_sw || []).map((x, i) => (i + 1) + ". " + x).join("\n") + "\n\n" +
      (sw ? "NYARAKA:\n" : "DOCUMENTS:\n") + (s.documents_sw || []).map((x) => "• " + x).join("\n") + "\n\n" +
      (sw ? "MAJIBU YAKO:\n" : "YOUR ANSWERS:\n") + (answers.length ? answers.join("\n") : (sw ? "(hakuna bado)" : "(none yet)"));
    S.mob.govOut = { text, cls: "GOOD", pre: true };
    speakSw((s.steps_sw || [])[0] || s.name);
    renderAll();
    return;
  }
  if (name === "gov-speak") {
    const q = $("gov_q");
    const t = q ? q.value.trim() : "";
    speakSw(t || (sw ? "Fundi agent hapa, nikusaidie nini?" : "Fundi agent here, how can I help?"));
    return;
  }
  if (name === "gov-search") { mobSet("govOut", sw ? "Utafutaji wa ndani haupatikani kwenye browser — tumia desktop ya mfumo." : "Local search not available in browser — use the desktop app.", "WARNING"); return; }
  if (name === "jamii-show") {
    const catEl = $("jamii_cat"), nEl = $("jamii_n");
    const n = Math.max(1, Math.min(3, parseInt(nEl ? nEl.value : "1", 10) || 1));
    const c = (((D.mobCommunity || {}).categories) || []).find((x) => x.id === (catEl ? catEl.value : ""));
    const p = c && (c.problems || [])[n - 1];
    if (!p) { mobSet("govOut", sw ? "Hakuna tatizo la namba hiyo." : "No problem with that number.", "WARNING"); return; }
    const text = "🤝 " + (c.name_sw || c.id) + " — " + p.p + "\n\n" + p.s + "\n\n" + (sw ? "NAMBARI ZA MSAADA: " : "HELP CONTACTS: ") + (p.contacts || []).join(" · ");
    S.mob.govOut = { text, cls: "GOOD", pre: true };
    speakSw((p.s || "").split(";")[0] || p.p);
    renderAll();
    return;
  }
  if (name.indexOf("email-") === 0 || name.indexOf("lic-") === 0 || name.indexOf("drv-") === 0) { mobSet("sysOut", bin, "FAIL"); return; }
  if (name.indexOf("mlz-") === 0 || name.indexOf("dr-") === 0 || name.indexOf("scr-") === 0) { mobSet("mlzOut", bin, "FAIL"); return; }
  if (name.indexOf("err-") === 0 || name.indexOf("reset-") === 0 || name.indexOf("bak-") === 0 || name.indexOf("guard-") === 0) { mobSet("advOut", bin, "FAIL"); return; }
  if (name === "netag-run") { mobSet("netagOut", bin, "FAIL"); return; }
  if (name === "pro-run") { mobSet("proOut", bin, "FAIL"); return; }
  if (name === "tel-calc") {
    const sel = $("net_formula"), a = $("net_args");
    const text = (sw ? "HESABU (browser — halisi):\n" : "COMPUTE (browser — real):\n") + telecomCalc(sel ? sel.value : "", a ? a.value : "");
    S.mob.telOut = { text, cls: "GOOD", pre: true };
    renderAll();
    return;
  }
  if (name === "tel-diag") { mobSet("telOut", sw ? "netdiag (L1→L7) inaendesha kwenye desktop — binary fundi-mobile." : "netdiag (L1→L7) runs on desktop — fundi-mobile binary.", "WARNING"); return; }
}
function wire() {
  const main = $("main");
  main.onclick = (ev) => {
    const t = ev.target.closest("[data-fx],[data-fxid],[data-dm],[data-sym],[data-av],[data-fundi],[data-job],[data-mob],[data-st],[data-hermes],#btnDiagClear");
    if (!t) return;
    if (t.dataset.st) {
      const p = t.dataset.st.split(":");
      if (p[0] === "tool") { S.studio.tool = p[1]; S.studio.sel = ""; }
      else if (p[0] === "pipe") { S.studio.pipe = p[1]; S.studio.idx = -1; S.studio.frames = []; S.studio.gate = null; }
      else if (p[0] === "viz") S.studio.viz = p[1];
      else if (p[0] === "probe") { probeAll(); return; }
      else S.studio.sel = t.dataset.st;
      renderAll();
      return;
    }
    if (t.dataset.hermes) {
      const a = t.dataset.hermes;
      if (a === "run") hermesRun();
      else if (a === "approve") hermesGate(true);
      else if (a === "deny") hermesGate(false);
      else { hermesStop(); renderAll(); }
      return;
    }
    if (t.dataset.fx) { S.fxTrade = t.dataset.fx; renderAll(); return; }
    if (t.dataset.fxid) { S.fxId = t.dataset.fxid; renderAll(); return; }
    if (t.dataset.dm) { S.diagModel = t.dataset.dm; S.diagOn = []; renderAll(); return; }
    if (t.dataset.sym) {
      setTimeout(() => {
        S.diagOn = Array.from(main.querySelectorAll("[data-sym]:checked")).map((c) => c.dataset.sym);
        renderAll();
      }, 0);
      return;
    }
    if (t.id === "btnDiagClear") { S.diagOn = []; renderAll(); return; }
    if (t.dataset.av) { avAction(t.dataset.av); return; }
    if (t.dataset.fundi) { fundiAction(t.dataset.fundi); return; }
    if (t.dataset.job) { const p = t.dataset.job.split("|"); fundiJob(p[0], p[1]); return; }
    if (t.dataset.mob) { mobAction(t.dataset.mob); return; }
  };
  main.oninput = (ev) => {
    const inp = ev.target.closest("[data-fx-inp]");
    if (inp) { fxLive(inp); return; }
    if (ev.target.id === "avMsg") {
      S.av.msg = ev.target.value;
      const b = $("avSolveBody");
      if (b) b.innerHTML = avSolveHtml(S.av.msg);
      return;
    }
    if (ev.target.id === "fundiApi") {
      S.fundi.api = ev.target.value.trim() || "http://127.0.0.1:8080";
      localStorage.setItem("mt_fundi_api", S.fundi.api);
    }
  };
  main.onchange = (ev) => {
    const cb = ev.target.closest("[data-mac]");
    if (!cb) return;
    const mac = cb.dataset.mac;
    S.fundi.targets = cb.checked ? Array.from(new Set(S.fundi.targets.concat([mac]))) : S.fundi.targets.filter((m) => m !== mac);
  };
}

(async function boot() {
  $("sbDate").textContent = new Date().toISOString().slice(0, 10);

  S.fxId = ((((D.formulas || {}).formulas) || [])[0] || {}).id || null;
  wire();
  renderAll();
  setInterval(() => { $("sbClock").textContent = new Date().toLocaleTimeString("en-GB"); }, 1000);
  /* STUDIO — liveness probes + upstream trees (HERMES mazingira ya kazi) */
  probeAll();
  loadUpstream();
  setInterval(() => { if (TAB === "studio") probeAll(); }, 12000);
  /* FUNDI DEPLOY — poll summary kila sekunde 5 (kama invalidateLater(5000) ya fundi.R) */
  setInterval(() => { fundiPollSummary(); }, 5000);
  /* FUNDI MOBILE — jobs/consents kila sekunde 15 (kama invalidateLater(15000) ya mobile.R) */
  setInterval(async () => {
    if (TAB !== "mobile") return;
    const j = await getJSON("../../data/mobile/jobs.json");
    const c = await getJSON("../../data/mobile/consents.json");
    if (j) D.mobJobsArr = Array.isArray(j) ? j : (((j || {}).jobs) || []);
    if (c) D.mobConsentsArr = Array.isArray(c) ? c : [];
    renderAll();
  }, 15000);
})();
