# SearXNG ya MTAALAMU SMART — meta-search engine ya bure (self-hosted)
# Mtaalamu inaitumia kwa SEARXNG_URL=http://127.0.0.1:8888
services:
  searxng:
    image: searxng/searxng:latest
    container_name: mtaalamu-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
