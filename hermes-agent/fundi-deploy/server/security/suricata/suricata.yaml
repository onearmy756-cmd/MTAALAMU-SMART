# Suricata — IDS config (MTECH OS)
# Inasimamia traffic ya wg0 (VPN) + LAN — inagundua mashambulizi, inatuma alerts kwa Wazuh.

vars:
  address-groups:
    HOME_NET: "[10.66.66.0/24,192.168.0.0/16,10.0.0.0/8]"
    EXTERNAL_NET: "!$HOME_NET"
  port-groups:
    HTTP_PORTS: "80,81,443,591,668,8080,8081,51820"

default-rule-path: /etc/suricata/rules
rule-files:
  - suricata.rules

outputs:
  - fast:
      enabled: yes
      filename: fast.log
  - eve-log:
      enabled: yes
      types:
        - alert
        - anomaly
        - dns
        - tls
        - flow
  - stats:
      enabled: yes

# Alerts zinapelekwa Wazuh (kwenye host): /var/log/suricata/eve.json
logging:
  default-log-level: notice
