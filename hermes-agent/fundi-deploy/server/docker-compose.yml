version: "3.8"

services:
  dnsmasq:
    image: 4km3/dnsmasq:2.86-r1
    container_name: fundi-dhcp
    network_mode: host
    cap_add: [NET_ADMIN]
    volumes:
      - ./dhcp/dnsmasq.conf:/etc/dnsmasq.conf:ro
      - ./tftp:/var/lib/tftpboot
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: fundi-http
    ports: ["80:80", "443:443"]
    volumes:
      - ./http/html:/usr/share/nginx/html:ro
      - ./images:/var/www/images:ro
      - ./http/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  samba:
    image: dperson/samba
    container_name: fundi-smb
    ports: ["137:137/udp", "138:138/udp", "139:139", "445:445"]
    volumes:
      - ./images:/images
    environment:
      - USER=fundi;fundi2026
      - SHARE=install;/images;yes;no;no;fundi
    restart: unless-stopped

  api:
    build: ./agent
    container_name: fundi-api
    ports: ["8080:8080", "51820:51820/udp"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./data:/data
      - ./tftp:/var/lib/tftpboot
      - ./images:/images
    environment:
      - FUNDI_CLOUD_URL=${FUNDI_CLOUD_URL:-disabled}
      - FUNDI_TENANT_ID=${FUNDI_TENANT_ID:-local}
      - FUNDI_TOKEN=${FUNDI_TOKEN:-}
      - FUNDI_BACKUP_MODE=${FUNDI_BACKUP_MODE:-stub}
      - FUNDI_IMAGES=/images
      - FUNDI_DEMO_HOSTS=${FUNDI_DEMO_HOSTS:-1}
      # WIREGUARD (P4): endpoint ya public (IP au domain ya server) — inaonekana kwenye client confs
      - FUNDI_WG_ENDPOINT=${FUNDI_WG_ENDPOINT:-}
      - FUNDI_WG_DIR=/data/wireguard
      # H5b — LanceDB-compatible vector store (AI memory) + pfSense REST API
      - FUNDI_LANCEDB_DIR=/data/lancedb
      - PFSENSE_API_URL=${PFSENSE_API_URL:-}
      - PFSENSE_API_KEY=${PFSENSE_API_KEY:-}
      - DATABASE_URL=sqlite:///data/fundi.db
      - RUST_LOG=info
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: fundi-ai
    ports: ["11434:11434"]
    volumes:
      - ./data/ollama:/root/.ollama
    restart: unless-stopped

  # H4 — LLM ENGINE: llama.cpp na Qwen 2.5 3B VL (GGUF halisi)
  # Model inapakuliwa mara moja kwenye ./data/models (GGUF ya Qwen2.5-VL-3B)
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: fundi-llamacpp
    ports: ["8081:8080"]
    volumes:
      - ./data/models:/models
    command: >-
      -m /models/qwen2.5-vl-3b-instruct-q4_k_m.gguf
      --host 0.0.0.0 --port 8080 --ctx-size 8192 --n-gpu-layers 0
    restart: unless-stopped

  # H4 — IDS: Suricata (inaskua traffic, inagundua mashambulizi)
  suricata:
    image: jasonish/suricata:latest
    container_name: fundi-suricata
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ./security/suricata:/etc/suricata
      - ./data/security/logs:/var/log/suricata
    command: -i eth0
    restart: unless-stopped

  # H4 — SIEM: Wazuh (inakusanya logs + alerts zote)
  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.0
    container_name: fundi-wazuh
    ports: ["1514:1514", "1515:1515", "514:514/udp"]
    volumes:
      - ./data/security/wazuh:/var/ossec/data
    restart: unless-stopped

  # H4 — CYBERSECURITY: Kali tools (pentesting + digital forensics kwa mbali kupitia wg0)
  kali-tools:
    image: kalilinux/kali-rolling:latest
    container_name: fundi-kali
    network_mode: host
    cap_add: [NET_ADMIN]
    volumes:
      - ./data/kali-work:/root/work
    command: >-
      sh -c "apt-get update -qq && apt-get install -y -qq nmap nikto john wireshark aircrack-ng hydra sqlmap tcpdump binwalk forensics-all >/dev/null 2>&1; tail -f /dev/null"
    restart: unless-stopped
