<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>MTAALAMU SMART — Ramani 3D (Picha Halisi)</title>
  <!--
    MTAALAMU SMART — RAMANI 3D ya kufaa-resources (KANUNI: offline-first, RAM ndogo)
    - MapLibre GL JS (BSD-3): inachora kwa GPU/WebGL — RAM ya CPU kidogo sana (~1MB heap yake)
    - Picha halisi: Esri World Imagery (ile ile ya map.js) + NASA GIBS (siku moja nyuma)
    - Milima halisi: Terrain DEM ya AWS (tiles za elevation, bila key)
    - GPS + Hali ya hewa + Hatari + Sauti ya Kiswahili (sw-TZ)
  -->
  <!-- REAL-TIME: preconnect — handshake za TCP/TLS zinafanywa MAPKEA, sio wakati wa tiles -->
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
  <link rel="preconnect" href="https://gibs.earthdata.nasa.gov" crossorigin />
  <link rel="preconnect" href="https://s3.amazonaws.com" crossorigin />
  <link rel="preconnect" href="https://demotiles.maplibre.org" crossorigin />
  <link rel="dns-prefetch" href="https://unpkg.com" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    :root {
      --bg: #04070d; --card: #0a1628; --line: rgba(0, 229, 255, 0.35);
      --cyan: #00e5ff; --green: #00ff88; --orange: #ffb300; --red: #ff3b3b;
      --text: #cfe9f5; --dim: #5e8aa3; --mono: 'Share Tech Mono', ui-monospace, monospace;
      --title: 'Rajdhani', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100%; }
    header {
      padding: 0.5rem 0.7rem; background: var(--card); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap;
    }
    header h1 {
      font-family: var(--title); font-size: 0.95rem; letter-spacing: 2px; color: #eafcff;
      text-shadow: 0 0 10px rgba(0,229,255,0.5); white-space: nowrap;
    }
    .btns { display: flex; gap: 0.3rem; flex-wrap: wrap; align-items: center; }
    button {
      padding: 0.4rem 0.6rem; border-radius: 6px; border: 1px solid var(--line); cursor: pointer;
      font-weight: 600; font-size: 0.76rem; background: #0f2233; color: var(--cyan);
      font-family: var(--mono); letter-spacing: 0.5px;
    }
    button:hover { background: #143048; }
    button.on { background: rgba(0,229,255,0.18); color: var(--green); border-color: var(--green); }
    button.danger { color: var(--red); border-color: rgba(255,59,59,0.55); }
    select {
      padding: 0.38rem 0.5rem; border-radius: 6px; border: 1px solid var(--line);
      background: #0f2233; color: var(--text); font-size: 0.76rem; font-family: var(--mono);
    }
    #map { flex: 1; min-height: 160px; }
    .maplibregl-ctrl-attrib { background: rgba(4,7,13,0.75) !important; color: var(--dim) !important; font-size: 10px !important; }
    .maplibregl-ctrl-attrib a { color: var(--cyan) !important; }
    #panel {
      background: var(--card); border-top: 1px solid var(--line);
      padding: 0.55rem 0.8rem; max-height: 26vh; overflow-y: auto;
    }
    #instruction { font-size: 0.95rem; line-height: 1.4; margin-bottom: 0.35rem; }
    #meta { font-size: 0.72rem; color: var(--dim); display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; }
    .badge {
      display: inline-block; padding: 0.12rem 0.42rem; border-radius: 4px;
      font-size: 0.66rem; background: #12263c; border: 1px solid var(--line); color: var(--dim);
    }
    .badge.ok { color: var(--green); border-color: rgba(0,255,136,0.5); }
    .badge.warn { color: var(--orange); border-color: rgba(255,179,0,0.5); }
    .badge.danger { color: var(--red); border-color: rgba(255,59,59,0.55); }
    .badge.info { color: var(--cyan); }
    .weather-box {
      margin-top: 0.35rem; padding: 0.4rem 0.5rem; border-radius: 6px;
      background: #0f1a2e; border: 1px solid var(--line); font-size: 0.78rem;
    }
    .legend {
      position: absolute; right: 10px; top: 10px; z-index: 5;
      background: rgba(4,7,13,0.82); border: 1px solid var(--line); border-radius: 8px;
      padding: 0.45rem 0.6rem; font-size: 0.68rem; color: var(--dim); pointer-events: none;
    }
    .legend b { color: var(--cyan); font-family: var(--title); letter-spacing: 1px; }
    /* Search suggestions (Nominatim + ndani) */
    .q-wrap { position: relative; }
    #q3d { padding: 0.4rem 0.5rem; border-radius: 6px; border: 1px solid var(--line); background: #0f2233; color: var(--text); font-family: var(--mono); font-size: 0.76rem; }
    #qList {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 30; display: none;
      background: var(--card); border: 1px solid var(--line); border-radius: 0 0 8px 8px; max-height: 220px; overflow-y: auto;
    }
    #qList div { padding: 0.4rem 0.55rem; cursor: pointer; font-size: 0.74rem; border-bottom: 1px solid #12263c; }
    #qList div:hover { background: #143048; }
    #qList .lvl { color: var(--dim); font-size: 0.62rem; margin-left: 0.3rem; }
    /* SKRINI KAMILI: fullscreen au ?full=1 — ramani PEKEE */
    :fullscreen header, :fullscreen #panel { display: none !important; }
    .pure-map header, .pure-map #panel { display: none !important; }
    #exitPure {
      display: none; position: fixed; right: 12px; bottom: 12px; z-index: 9;
    }
    .pure-map #exitPure { display: inline-block; }
  </style>
</head>
<body>
<div id="app">
  <button type="button" id="exitPure" onclick="location.href='ramani-3d.html'" title="Rudi na panel">↩️ Rudi</button>
  <header>
    <h1>🌍 RAMANI 3D</h1>
    <div class="btns">
      <button type="button" id="btnSat" class="on">🛰️ Picha Halisi</button>
      <button type="button" id="btnLabels" class="on">🏷️ Lebo</button>
      <button type="button" id="btnFull">⛶ Skrini</button>
      <button type="button" id="btnTerrain" class="on">⛰️ Milima 3D</button>
      <button type="button" id="btnTilt">🔄 Mwelekeo</button>
      <button type="button" id="btnFly">✈️ Ndege (Dar)</button>
      <button type="button" id="btnGps">📍 GPS</button>
      <button type="button" id="btnWeather" class="off">☁️ Hewa</button>
      <button type="button" id="btnHazards">⚠️ Hatari</button>
      <button type="button" id="btnIoT">📡 Vifaa IoT</button>
      <button type="button" id="btnMission">🤖 HERMES Mission</button>
      <button type="button" id="btnVoice" title="Washa/zima sauti ya Kiswahili">🔈 Sauti: ON</button>
      <span class="q-wrap"><input id="q3d" type="search" placeholder="🔎 Tafuta sehemu..." autocomplete="off" style="max-width:140px" /><div id="qList"></div></span>
      <button type="button" id="btnNet" class="on">🕸️ Miunganisho</button>
      <button type="button" id="btnCities">🏙️ Miji</button>
      <button type="button" id="btnRegions">🗺️ Mikoa</button>
      <button type="button" id="btnHier">🏘️ Hierarkia</button>
      <button type="button" id="btnPeople">👷 Wafundi</button>
      <button type="button" id="btnCorridors">🛣️ Corridor</button>
      <button type="button" id="btnFollow">🧭 Follow</button>
      <select id="baseSel" title="Chagua chanzo cha picha">
        <option value="esri">Esri World Imagery</option>
        <option value="gibs">NASA GIBS (leo)</option>
        <option value="osm">OSM (ramani)</option>
      </select>
    </div>
  </header>
  <div style="position:relative; flex:1; display:flex; flex-direction:column; min-height:0;">
    <div id="map"></div>
    <div class="legend">
      <b>RAMANI 3D HALISI</b><br/>
      GPU/WebGL — RAM ndogo<br/>
      Esri Imagery + Lebo halisi<br/>
      <span id="fpsBadge">fps: —</span>
    </div>
  </div>
  <div id="panel">
    <div id="instruction">Karibu Ramani 3D. Picha halisi + milima ya kweli. Bonyeza GPS au Ndege (Dar).</div>
    <div id="meta">
      <span class="badge" id="gpsStatus">GPS: —</span>
      <span class="badge info" id="terrainStatus">Milima 3D: ON</span>
      <span class="badge info" id="weatherBadge">Hewa: —</span>
      <span class="badge" id="hzBadge">Hatari: ZIMEFICHWA</span>
      <span class="badge" id="hierBadge">Hierarkia: IMEFICHWA</span>
      <span class="badge" id="iotBadge">IoT: ZIMEFICHWA</span>
      <span class="badge ok" id="liveBadge">LIVE: —</span>
      <span class="badge info" id="missionBadge">HERMES: TAYARI</span>
    </div>
    <div id="weatherBox" class="weather-box" style="display:none"></div>
  </div>
</div>

<script>
/* ============================================================
 * RAMANI 3D — MTAALAMU SMART
 * Kanuni: GPU ndiyo inachora (MapLibre WebGL) — RAM ya CPU kidogo.
 * Picha halisi: Esri World Imagery / NASA GIBS | Milima: AWS Terrain DEM
 * Sauti: Web Speech API (sw-TZ) | Hewa: Open-Meteo | GPS: navigator
 * ============================================================ */
"use strict";

const VOICE_PROMPTS = {
  welcome: "Karibu Ramani ya tatu. Picha halisi na milima ya kweli zimewasha.",
  gps_searching: "Inatafuta mahali ulipo.",
  gps_ok: "Mahali ulipo limetambuliwa.",
  gps_fail: "Ishara ya GPS imepotea.",
  terrain_on: "Milima ya tatu imewashwa.",
  terrain_off: "Milima ya tatu imesimamishwa.",
  weather_alert: "Onyo la hali ya hewa.",
  hazard: "Tahadhari. Kuna hatari kwenye ramani."
};

let voiceOn = true;
let lastInstruction = VOICE_PROMPTS.welcome;

function setInstruction(t) {
  lastInstruction = t;
  document.getElementById("instruction").textContent = t;
}

function speak(text) {
  if (!voiceOn || !window.speechSynthesis) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "sw-TZ"; u.rate = 0.92;
    const vs = speechSynthesis.getVoices() || [];
    const sw = vs.find(v => v.lang && (v.lang.toLowerCase().startsWith("sw") || v.lang.includes("Swahili")));
    if (sw) u.voice = sw;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) { /* sauti ni hiari */ }
}
(function () {
  const b = document.getElementById("btnVoice");
  if (!window.speechSynthesis) { b.textContent = "🚫 Sauti"; b.disabled = true; return; }
  b.onclick = () => {
    voiceOn = !voiceOn;
    b.textContent = voiceOn ? "🔈 Sauti: ON" : "🔇 Sauti: OFF";
    b.classList.toggle("on", voiceOn);
    if (voiceOn) speak(lastInstruction);
  };
  const check = () => {
    const vs = speechSynthesis.getVoices() || [];
    const has = vs.some(v => (v.lang || "").toLowerCase().startsWith("sw"));
    b.title = has ? "Voice ya Kiswahili ipo" : "Hakuna voice ya sw — itatumia nyingine";
  };
  check();
  if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = check;
})();

/* ---------- RAMANI (MapLibre GL — GPU) ---------- */
/* Raster style: tiles halisi, si vector nzito — data kidogo, picha halisi */
/* ---------- SITES ZA IOT (zinatumika pia ndani ya style ya map — lazima ziwekwe MAPEMA) ---------- */
const IOT_SITES = {
  afya:    { name: "Hospitali (mfano)",  lng: 39.26, lat: -6.82, ico: "🏥" },
  usalama: { name: "Nyumba salama",      lng: 39.24, lat: -6.79, ico: "🛡️" },
  nyumbani:{ name: "Bodi ya nyumbani",   lng: 39.22, lat: -6.76, ico: "🏠" },
  kilimo:  { name: "Shamba (kilimo)",    lng: 36.68, lat: -3.39, ico: "🌱" }
};

const BASEMAPS = {
  esri: {
    tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
    attribution: "Picha: Esri World Imagery"
  },
  gibs: { tiles: [], attribution: "Picha: NASA EOSDIS GIBS (MODIS Terra)" },
  osm: {
    tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
    attribution: "© OpenStreetMap contributors"
  }
};

function gibsDateStr(d) {
  const m = ("0" + (d.getMonth() + 1)).slice(-2), day = ("0" + d.getDate()).slice(-2);
  return d.getFullYear() + "-" + m + "-" + day;
}
function gibsTiles() {
  const d = gibsDateStr(new Date(Date.now() - 86400000));
  return ["https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/" + d + "/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg"];
}

function baseStyle(id) {
  const cfg = id === "gibs" ? { tiles: gibsTiles(), attribution: BASEMAPS.gibs.attribution } : BASEMAPS[id];
  /* PROGRESSIVE: style ya mwanzo ina PICHA TU — lebo na sites zinaongezwa
   * baada ya frame ya kwanza (ensureLabelLayers) ili map ionekane HARAKA. */
  return {
    version: 8,
    /* Glyphs za bure (MapLibre demo) — kwa ajili ya majina ya sites za IoT */
    glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
    sources: {
      base: {
        type: "raster",
        tiles: cfg.tiles,
        tileSize: 256,
        maxzoom: id === "gibs" ? 9 : 19,
        attribution: cfg.attribution
      },
      terrain: {
        type: "raster-dem",
        tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
        encoding: "terrarium",
        tileSize: 256,
        maxzoom: 12
      }
    },
    layers: [
      { id: "bg", type: "background", paint: { "background-color": "#0a1220" } },
      { id: "base", type: "raster", source: "base", paint: { "raster-fade-duration": 0 } }
    ]
  };
}

/* ---------- PROGRESSIVE EXTRAS (lebo + sites) — zinaongezwa baada ya load ---------- */
function ensureLabelLayers() {
  if (!map.getSource("labels_places")) {
    map.addSource("labels_places", {
      type: "raster",
      tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"],
      tileSize: 256,
      maxzoom: 19,
      attribution: "Lebo: Esri World Boundaries & Places"
    });
  }
  if (!map.getSource("labels_streets")) {
    map.addSource("labels_streets", {
      type: "raster",
      tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}"],
      tileSize: 256,
      maxzoom: 19,
      attribution: "Lebo za barabara: Esri World Transportation"
    });
  }
  if (!map.getSource("sites")) {
    map.addSource("sites", {
      type: "geojson",
      data: {
        type: "FeatureCollection",
        features: Object.keys(IOT_SITES).map(function (k) {
          const s = IOT_SITES[k];
          return { type: "Feature", geometry: { type: "Point", coordinates: [s.lng, s.lat] }, properties: { name: s.name, ico: s.ico, key: k } };
        })
      }
    });
  }
  if (!map.getLayer("labels-places")) {
    map.addLayer({ id: "labels-places", type: "raster", source: "labels_places", paint: { "raster-opacity": 1 } });
  }
  if (!map.getLayer("labels-streets")) {
    map.addLayer({ id: "labels-streets", type: "raster", source: "labels_streets", paint: { "raster-opacity": 1 } });
  }
  if (!map.getLayer("site-label")) {
    map.addLayer({ id: "site-label", type: "symbol", source: "sites", layout: {
        "text-field": ["get", "ico"], "text-font": ["Noto Sans Regular"],
        "text-size": 16, "text-offset": [0, -1.4], "text-anchor": "bottom",
        "text-allow-overlap": true, "visibility": "none"
      }, paint: { "text-color": "#00e5ff", "text-halo-color": "#04070d", "text-halo-width": 2 } });
  }
  /* MAJINA YA MIJI — symbol labels zenye halo nzito: zinaonekana VIZURI juu ya picha yoyote */
  const citiesLbl = (window.MT_GEO_FULL && window.MT_GEO_FULL.cities) || [];
  if (citiesLbl.length) {
    if (!map.getSource("city-names")) {
      map.addSource("city-names", { type: "geojson", data: { type: "FeatureCollection", features: citiesLbl.map((c, i) => ({
        type: "Feature", id: i, geometry: { type: "Point", coordinates: [c.lng, c.lat] }, properties: { name: c.name }
      })) } });
    }
    if (!map.getLayer("city-name-labels")) {
      map.addLayer({ id: "city-name-labels", type: "symbol", source: "city-names", layout: {
          "text-field": ["get", "name"], "text-font": ["Noto Sans Regular"],
          "text-size": 14, "text-letter-spacing": 0.1, "text-anchor": "center",
          "text-allow-overlap": true
        }, paint: { "text-color": "#ffffff", "text-halo-color": "#04070d", "text-halo-width": 2.5 } });
    }
  }
  labelsApply(labelsOn);
}

const map = new maplibregl.Map({
  container: "map",
  style: baseStyle("esri"),
  center: [39.2083, -6.7924],     /* Dar es Salaam */
  zoom: 11.2,
  pitch: 62,                       /* mtazamo wa 3D */
  bearing: -18,
  maxPitch: 80,
  antialias: false,                /* RAM/gpu kidogo */
  attributionControl: { compact: true },
  /* REAL-TIME tuning: hakuna fade, hakuna ku-fetch upya kila wakati, cache ndogo */
  fadeDuration: 0,
  refreshExpiredTiles: false,
  maxTileCacheSize: 64,
  renderWorldCopies: false
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-left");
map.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-left");

/* ---------- MILIMA 3D (AWS Terrain DEM) ---------- */
let terrainOn = true;
function setTerrain(on) {
  try {
    if (on) {
      map.setTerrain({ source: "terrain", exaggeration: 1.25 });
      document.getElementById("terrainStatus").textContent = "Milima 3D: ON";
      document.getElementById("terrainStatus").className = "badge ok";
    } else {
      map.setTerrain(null);
      document.getElementById("terrainStatus").textContent = "Milima 3D: OFF";
      document.getElementById("terrainStatus").className = "badge";
    }
  } catch (e) { /* terrain haiwezekani kwenye GPU dhaifu */ }
}
map.on("load", () => {
  map._mtLoaded = true;              /* standalone auto-on inatumia hii */
  ensureLabelLayers();               /* lebo zinajitokeza BAADA YA picha (fast first paint) */
  if (netOn) netApply(true);         /* miunganisho halisi: HERMES ↔ sites */
  map.once("idle", () => setTerrain(terrainOn));  /* milima: baada ya frame ya kwanza */
  /* Fog/anga: hali halisi ya anga bila gharama ya texture */
  try {
    map.setSky({
      "sky-color": "#7fb8e6",
      "fog-color": "#cfe9f5",
      "fog-ground-blend": 0.6,
      "horizon-fog-blend": 0.5,
      "sky-horizon-blend": 0.6,
      "atmosphere-blend": ["interpolate", ["linear"], ["zoom"], 0, 0.8, 10, 0.4, 16, 0]
    });
  } catch (e) { /* toleo la maplibre lisilo na setSky */ }
  speak(VOICE_PROMPTS.welcome);
});
document.getElementById("btnTerrain").onclick = () => {
  terrainOn = !terrainOn;
  document.getElementById("btnTerrain").classList.toggle("on", terrainOn);
  setTerrain(terrainOn);
  speak(terrainOn ? VOICE_PROMPTS.terrain_on : VOICE_PROMPTS.terrain_off);
};

/* ---------- KUBADILISHA PICHA (basemap) ---------- */
document.getElementById("btnSat").onclick = () => { setBase("esri"); };
document.getElementById("baseSel").onchange = (e) => setBase(e.target.value);
function setBase(id) {
  const s = baseStyle(id);
  map.setStyle(s, { diff: true });
  /* terrain + lebo + hatari + IoT zinarudishwa baada ya style mpya */
  setTimeout(() => {
    ensureAllDynamic();
  }, 400);
  document.getElementById("btnSat").classList.toggle("on", id === "esri" || id === "gibs");
}

/* ---------- LEBO HALISI (majina ya mikoa/miji/barabara — Esri Reference) ---------- */
let labelsOn = true;
function labelsApply(on) {
  try {
    if (map.getLayer("labels-places")) {
      map.setLayoutProperty("labels-places", "visibility", on ? "visible" : "none");
    }
    if (map.getLayer("labels-streets")) {
      map.setLayoutProperty("labels-streets", "visibility", on ? "visible" : "none");
    }
    if (map.getLayer("site-label")) {
      map.setLayoutProperty("site-label", "visibility", on && iotOn ? "visible" : "none");
    }
    if (map.getLayer("city-name-labels")) {
      map.setLayoutProperty("city-name-labels", "visibility", on ? "visible" : "none");
    }
  } catch (e) { /* style inabadilishwa — labelsApply inaitwa tena na setBase */ }
}
document.getElementById("btnLabels").onclick = () => {
  labelsOn = !labelsOn;
  document.getElementById("btnLabels").classList.toggle("on", labelsOn);
  labelsApply(labelsOn);
  setInstruction(labelsOn ? "Lebo za majina zimewashwa (miji + barabara)." : "Lebo zimefichwa — picha pekee.");
  speak(labelsOn ? "Lebo za majina zimewashwa." : "Lebo zimafichwa.");
};

/* ---------- MWELEKEO / NDEGE ---------- */
let tilted = true;
document.getElementById("btnTilt").onclick = () => {
  tilted = !tilted;
  map.easeTo({ pitch: tilted ? 62 : 0, bearing: tilted ? -18 : 0, duration: 600 });
  document.getElementById("btnTilt").classList.toggle("on", !tilted);
};
document.getElementById("btnFly").onclick = () => {
  map.flyTo({ center: [39.2083, -6.7924], zoom: 15.5, pitch: 68, bearing: -30, duration: 5200, essential: true });
  speak("Ndege kwenda Dar es Salaam. Tazama jiji kwa tatu.");
};

/* ---------- SKRINI KAMILI (⛶ au ?full=1) ---------- */
document.getElementById("btnFull").onclick = () => {
  const el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el);

/* ---------- GPS ---------- */
let watchId = null;
document.getElementById("btnGps").onclick = () => {
  if (!navigator.geolocation) { document.getElementById("gpsStatus").textContent = "GPS: hakuna"; return; }
  document.getElementById("gpsStatus").textContent = "GPS: inatafuta...";
  document.getElementById("gpsStatus").className = "badge info";
  speak(VOICE_PROMPTS.gps_searching);
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition((pos) => {
    const ll = [pos.coords.longitude, pos.coords.latitude];
    map._mtUserLL = ll;
    /* REAL-TIME trail: njia unayotembea inachorwa (kama map.js ya 2D) */
    const last = trailCoords[trailCoords.length - 1];
    if (!last || Math.abs(last[0] - ll[0]) > 0.00004 || Math.abs(last[1] - ll[1]) > 0.00004) {
      trailCoords.push(ll);
      drawTrail();
    }
    document.getElementById("gpsStatus").textContent = "GPS: OK ±" + Math.round(pos.coords.accuracy) + "m";
    document.getElementById("gpsStatus").className = "badge ok";
    speakOnce(VOICE_PROMPTS.gps_ok);
    if (!map._mtUser) {
      map._mtUser = true;
      map.addSource("user", { type: "geojson", data: { type: "Feature", geometry: { type: "Point", coordinates: ll } } });
      map.addLayer({ id: "user-acc", type: "circle", source: "user",
        paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 10, ["*", 0.002, Math.max(30, pos.coords.accuracy)], 16, ["*", 8, Math.max(6, pos.coords.accuracy / 100)]],
                 "circle-color": "#00e5ff", "circle-opacity": 0.18 } });
      map.addLayer({ id: "user-dot", type: "circle", source: "user",
        paint: { "circle-radius": 7, "circle-color": "#00e5ff", "circle-stroke-width": 3, "circle-stroke-color": "#ffffff" } });
      map.flyTo({ center: ll, zoom: 15.5, pitch: 62, duration: 2400 });
    } else {
      map.getSource("user").setData({ type: "Feature", geometry: { type: "Point", coordinates: ll } });
      if (followOn) map.easeTo({ center: ll, duration: 700 });
    }
  }, () => {
    document.getElementById("gpsStatus").textContent = "GPS: dhaifu";
    document.getElementById("gpsStatus").className = "badge warn";
    speak(VOICE_PROMPTS.gps_fail);
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 });
};
let _gpsSaid = false;
function speakOnce(t) { if (!_gpsSaid) { speak(t); _gpsSaid = true; } }

/* ---------- STANDALONE / PREVIEW mode: hash tupu → soma JSON halisi za mradi ----------
 * Inafanya kazi kwa scripts/preview_server.py (root = repo): fetch kama hii
 *   ../data/geo.json            → web-r/data/geo.json (hazards)

(async function () {

  try {

      if (r.ok) {
        const d = await r.json();
        window.MT_IOT_3D = { devices: d.devices || [] };
      }
    }
  } catch (e) { /* 404 au offline — OK */ }
  try {
    /* HIERARKIA kamili: mikoa→wilaya→tarafa→kata→vijiji→vitongoji→mtaa→barabara */
    const h = await fetch("../data/geo_hierarchy_index.json");
    if (h.ok) window.MT_HIER = await h.json();
  } catch (e) { /* 404 au offline — OK */ }
  map.on("load", () => {
    setTimeout(() => {
      if ((window.MT_GEO_3D && window.MT_GEO_3D.hazards || []).length) {
        const b = document.getElementById("btnHazards");

      if ((window.MT_IOT_3D && window.MT_IOT_3D.devices || []).length) {

        if (!b2.classList.contains("on")) b2.click();

      /* VYOTE kutoka ramani ya 2D — defaults kama map.js (boundaries/cities/techs ON) */
      if (window.MT_GEO_FULL) {
        ensureLabelLayers();   /* city-name labels zinajipakia data ikifika */

      if (window.MT_HIER && !hierOn) {
        document.getElementById("btnHier").click();
      }
    }, 300);
  });
})();

  }

    const site = IOT_SITES[d.vertical] || IOT_SITES.nyumbani;
    const j = (i % 5) - 2;
    return {
      type: "Feature",
      geometry: { type: "Point", coordinates: [site.lng + j * 0.004, site.lat + (i % 3) * 0.0025] },
      properties: { id: d.id, name: (d.name && d.name.sw) || d.id, icon: d.icon || "📡",
                    vert: d.vertical, demo: !!d.demo,

               "circle-color": ["get", "color"], "circle-opacity": 0.95,
               "circle-stroke-width": 2, "circle-stroke-color": "#ffffff" } });
    map.on("click", "iot-dot", (e) => {
      const p = e.features[0].properties;

        "Device: " + p.id +

        "<br/><button onclick=\"window.dispatchEvent(new CustomEvent('mt-hermes-run',{detail:'" + p.id + "'}))\" style=\"background:#00e5ff;border:0;padding:4px 10px;border-radius:4px;cursor:pointer;font-weight:700;margin-top:4px\">🤖 HERMES anuchunguze</button>"
      ).addTo(map);
    });
    map.on("mouseenter", "iot-dot", () => { map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", "iot-dot", () => { map.getCanvas().style.cursor = ""; });
  } else {
    map.getSource("iot").setData({ type: "FeatureCollection", features: feats });
  }
  document.getElementById("iotBadge").textContent = "IoT: " + feats.length + " vifaa";
  document.getElementById("iotBadge").className = "badge ok";
  setInstruction("Vifaa " + feats.length + " vya IoT (verticals 4) vimeonyeshwa. Bofya kifaa → HERMES anuchunguze.");
  speak("Vifaa vya IoT vimeonyeshwa kwenye ramani ya tatu.");

/* ---------- HERMES MISSION (iot_incident pipeline kwenye 3D) ---------- */
/* Events: 'mt-hermes-run' kutoka popups; panel inaonyesha hatua PIITVD + heat za IoT */
let missionStep = -1, missionTimer = null;
const MISSION_LABELS = (window.MT_PIPE_3D && window.MT_PIPE_3D.steps) ||
  ["ingest + classify", "bayes + knowledge", "mpango + HITL", "omba ruhusa", "tekeleza", "pima upya", "scribe", "learner"];
window.addEventListener("mt-hermes-run", (ev) => {
  const deviceId = (ev.detail || "").toString();
  runMission(deviceId);
});
document.getElementById("btnMission").onclick = () => runMission("");
function runMission(deviceId) {
  if (missionTimer) clearInterval(missionTimer);
  if (!iotOn) document.getElementById("btnIoT").click();
  missionStep = -1;
  document.getElementById("missionBadge").textContent = "HERMES: INAENDELEA...";
  document.getElementById("missionBadge").className = "badge warn";
  setInstruction("🤖 HERMES mission (iot_incident" + (deviceId ? " · " + deviceId : "") + ") imeanza...");

      document.getElementById("missionBadge").className = "badge ok";
      setInstruction("🤖 HERMES mission imekamilika. Ripoti iko tayari (scribe + learner).");
      speak("Kazi imekamilika.");
      return;
    }
    const lbl = MISSION_LABELS[missionStep];

      speak("Nahitaji ruhusa yako. Hii ni HITL.");
    }
  }, 1600);
}

/* ============================================================
 * NETWORK HALISI + VYOTE KUTOKA RAMANI YA 2D (map.js / geo.json)
 *  - HERMES hub ↔ sites: mistari inayotembea (miunganisho halisi)
 *  - Agents zinaonekana: 🤖 HERMES + 🧠 🕷️ 🎙️ 💬 workers
 *  - Miji 12 · Mikoa 30 + stats · Wafundi 8 / Wateja 7 / Kazi 4
 *  - Corridors 8 · Search (Nominatim) · OSRM routing · GPS trail
 * Data: web-r/data/geo.json (JSON = chanzo, kama map.js ilivyofanya)
 * ============================================================ */
const HERMES_HUB = { lng: 39.2083, lat: -6.7924, name: "HERMES Gateway", ico: "🤖" };
const NET_WORKERS = [
  { id: "langchain", ico: "\uD83E\uDDE0", dx: 0.012, dy: 0.005 },
  { id: "crawl4ai", ico: "\uD83D\uDD77\uFE0F", dx: -0.012, dy: 0.006 },
  { id: "whisper", ico: "\uD83C\uDFA4", dx: 0.010, dy: -0.007 },
  { id: "ollama", ico: "\uD83D\uDCAC", dx: -0.011, dy: -0.007 }
];
let netOn = true, netTimer = null, netStep = 0;
let citiesOn = false, regionsOn = false, peopleOn = false, corridorsOn = false, followOn = false;
let REGIONS_GEO = null, lastRouteGeo = null;
const trailCoords = [];

window.MT3D = {
  /* HIERARKIA: zoom kwenda feature + drill-down kwenda watoto wake */
  hierZoom: function (id) {
    const f = ((HIER_GEO && HIER_GEO.features) || []).find((x) => x.properties.id === id);
    if (!f) return;
    const p = f.properties;
    const lv = HIER_LEVELS.find((l) => l.id === p.level);
    const ZOOMS = { mkoa: 9, wilaya: 11, tarafa: 13, kata: 14, kijiji: 15, vitongoji: 16, mtaa: 16, barabara: 14 };
    map.flyTo({ center: [p.lng, p.lat], zoom: Math.max(map.getZoom(), ZOOMS[p.level] || 14), pitch: 60, duration: 2200 });
    setInstruction("🔍 " + (lv ? lv.sw : p.level) + ": " + p.name_sw + " — mkoa wa " + p.region + ".");
    speak(p.name_sw + ". Mkoa wa " + p.region + ".");
  },
  hierUp: function (id) {
    const f = ((HIER_GEO && HIER_GEO.features) || []).find((x) => x.properties.id === id);
    if (!f) return;
    const p = f.properties;
    const parentId = p.parent_id || p.region_id;
    const pf = ((HIER_GEO && HIER_GEO.features) || []).find((x) => x.properties.id === parentId && x.properties.level !== "barabara")
      || ((HIER_GEO && HIER_GEO.features) || []).find((x) => x.properties.id === p.region_id);
    if (!pf) return;
    const q = pf.properties;
    MT3D.hierZoom(q.id);
    new maplibregl.Popup({ maxWidth: "300px" }).setLngLat([q.lng, q.lat]).setHTML(hierPopupHtml(q)).addTo(map);
  },
  /* OSRM routing — kutoka GPS (au mtazamo) kwenda lengo; njia halisi ya barabara */
  routeTo: async function (lat, lng, name) {
    const start = map._mtUserLL || (function () { const c = map.getCenter(); return [c.lng, c.lat]; })();
    try {
      const url = "https://router.project-osrm.org/route/v1/driving/" + start[0] + "," + start[1] + ";" + lng + "," + lat + "?overview=full&geometries=geojson&steps=true";
      const r = await fetch(url);
      const d = await r.json();
      const rt = d.routes && d.routes[0];
      if (!rt) throw new Error("hakuna njia");
      lastRouteGeo = rt.geometry;
      if (!map.getSource("route")) {
        map.addSource("route", { type: "geojson", data: rt.geometry });
        map.addLayer({ id: "route-casing", type: "line", source: "route", paint: { "line-color": "#04070d", "line-width": 10, "line-opacity": 0.5 } });
        map.addLayer({ id: "route-line", type: "line", source: "route", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#00ff88", "line-width": 6, "line-opacity": 0.9 } });
      } else {
        map.getSource("route").setData(rt.geometry);
      }
      const km = (rt.distance / 1000).toFixed(1), min = Math.round(rt.duration / 60);
      setInstruction("\uD83D\uDEE3\uFE0F Njia kwenda " + name + ": " + km + " km · dakika " + min + " · hatua " + rt.legs[0].steps.length + " (OSRM halisi)");
      speak("Njia iko tayari. Kilomita " + km + ", dakika " + min + " kwenda " + name + ".");
    } catch (e) {
      setInstruction("Njia haipatikani kwa sasa (OSRM): " + e.message);
    }
  }
};

function drawTrail() {
  if (trailCoords.length < 2) return;
  const geom = { type: "LineString", coordinates: trailCoords.slice() };
  if (!map.getSource("trail")) {
    map.addSource("trail", { type: "geojson", data: geom });
    map.addLayer({ id: "trail-line", type: "line", source: "trail", paint: { "line-color": "#ffb300", "line-width": 3, "line-opacity": 0.8, "line-dasharray": [2, 2] } });
  } else {
    map.getSource("trail").setData(geom);
  }
}

/* ---------- 🕸️ MIUNGANISHO HALISI: HERMES ↔ sites + agents wanaonekana ---------- */
function netApply(on) {
  if (!on) {
    ["net-line", "net-node", "net-icons"].forEach((id) => { if (map.getLayer(id)) map.removeLayer(id); });
    ["net", "net-nodes"].forEach((id) => { if (map.getSource(id)) map.removeSource(id); });
    if (netTimer) { clearInterval(netTimer); netTimer = null; }
    setInstruction("Miunganisho ya HERMES imefichwa.");
    return;
  }
  if (!map.getSource("net")) {
    const lines = Object.keys(IOT_SITES).map((k) => ({
      type: "Feature",
      properties: { name: IOT_SITES[k].name },
      geometry: { type: "LineString", coordinates: [[HERMES_HUB.lng, HERMES_HUB.lat], [IOT_SITES[k].lng, IOT_SITES[k].lat]] }
    }));
    map.addSource("net", { type: "geojson", data: { type: "FeatureCollection", features: lines } });
    map.addLayer({ id: "net-line", type: "line", source: "net", layout: { "line-cap": "round" }, paint: { "line-color": "#00e5ff", "line-width": 2.5, "line-opacity": 0.8, "line-dasharray": [0, 4, 3] } });

    const nodes = [{ type: "Feature", geometry: { type: "Point", coordinates: [HERMES_HUB.lng, HERMES_HUB.lat] }, properties: { ico: HERMES_HUB.ico, name: HERMES_HUB.name, kind: "hub" } }]
      .concat(NET_WORKERS.map((w) => ({
        type: "Feature",
        geometry: { type: "Point", coordinates: [HERMES_HUB.lng + w.dx, HERMES_HUB.lat + w.dy] },
        properties: { ico: w.ico, name: w.id, kind: "worker" }
      })));
    map.addSource("net-nodes", { type: "geojson", data: { type: "FeatureCollection", features: nodes } });
    map.addLayer({ id: "net-node", type: "circle", source: "net-nodes", filter: ["==", ["get", "kind"], "hub"],
      paint: { "circle-radius": 10, "circle-color": "#00e5ff", "circle-stroke-width": 3, "circle-stroke-color": "#ffffff" } });
    map.addLayer({ id: "net-icons", type: "symbol", source: "net-nodes",
      layout: { "text-field": ["get", "ico"], "text-font": ["Noto Sans Regular"], "text-size": 17, "text-offset": [0, -0.4], "text-anchor": "bottom", "text-allow-overlap": true },
      paint: { "text-color": "#00e5ff", "text-halo-color": "#04070d", "text-halo-width": 2 } });

    map.on("click", "net-node", (e) => {
      const p = e.features[0].properties;
      const html = p.kind === "hub"

/* ---------- 🏘️ HIERARKIA KAMILI (geo_hierarchy_index.json) ----------
 * Mikoa → Wilaya → Tarafa → Kata → Vijiji → Vitongoji → Mtaa → Barabara

 * Popup: bofya → maelezo + vitufe vya KUZAMA (drill-down) na KUPANDA.
 * Ngazi za chini ziko kwenye ring za mkoa (placement) — onyo kwenye popup.
 */
const HIER_LEVELS = [
  { id: "mkoa",      sw: "Mkoa",     color: "#00e5ff", minzoom: 0,  size: 15 },
  { id: "wilaya",    sw: "Wilaya",   color: "#b388ff", minzoom: 0,  size: 11 },
  { id: "tarafa",    sw: "Tarafa",   color: "#ff9100", minzoom: 8,  size: 9 },
  { id: "kata",      sw: "Kata",     color: "#00ff88", minzoom: 9,  size: 8 },
  { id: "kijiji",    sw: "Kijiji",   color: "#8bc34a", minzoom: 10, size: 7 },
  { id: "vitongoji", sw: "Kitongoji", color: "#40c4ff", minzoom: 11, size: 6 },
  { id: "mtaa",      sw: "Mtaa",     color: "#ffd54f", minzoom: 11, size: 6 },
  { id: "barabara",  sw: "Barabara", color: "#ff5252", minzoom: 9,  size: 7 }
];
let hierOn = false, HIER_GEO = null;
function hierCount(level) {
  return (HIER_GEO && HIER_GEO.features || []).filter((f) => f.properties.level === level).length;
}
function hierPopupHtml(p) {
  const lv = HIER_LEVELS.find((l) => l.id === p.level) || { sw: p.level, color: "#00e5ff" };
  let html = "<b style='color:" + lv.color + "'>" + lv.sw.toUpperCase() + ": " + p.name_sw + "</b>";
  if (p.name_en && p.name_en !== p.name_sw) html += "<br/><span style='color:#5e8aa3'>" + p.name_en + "</span>";
  html += "<br/>Mkoa: " + p.region;
  if (p.parent) html += "<br/>Ndani ya: " + p.parent;
  if (p.level === "mkoa" && (p.jobs || p.techs || p.customers)) {
    html += "<div>Kazi: <b>" + (p.jobs || 0) + "</b> · Mafundi: <b>" + (p.techs || 0) + "</b> · Wateja: <b>" + (p.customers || 0) + "</b></div>";
  }
  if (p.road_type) html += "<div>Aina: " + p.road_type + "</div>";
  if (p.placed) html += "<br/><i style='color:#ffb300'>Mahali: placement ya hierarkia (ring ya mkoa) — sio survey halisi.</i>";

  html += "</div>";
  return html;
}
function hierApply(on) {
  const feats = (HIER_GEO && HIER_GEO.features) || [];
  if (!on || !feats.length) {
    HIER_LEVELS.forEach((l) => {
      ["hier-" + l.id, "hier-label-" + l.id].forEach((id) => { if (map.getLayer(id)) map.removeLayer(id); });

      const filter = l.id === "barabara"
        ? ["all", ["==", ["get", "level"], "barabara"]]
        : ["all", ["==", ["get", "level"], l.id]];
      if (l.id === "barabara") {
        map.addLayer({ id: "hier-" + l.id, type: "line", source: "hier", filter: filter,

        map.addLayer({ id: "hier-label-" + l.id, type: "symbol", source: "hier", filter: filter,
          minzoom: Math.max(l.minzoom, 11),

  setInstruction("🏘️ Hierarkia kamili: " + parts + ". Bofya alama → drill-down (⬇️) na ngazi ya juu (⬆️).");
  speak("Hierarkia ya Tanzania imeonyeshwa. Mikoa, wilaya, tarafa, kata, vijiji, vitongoji, mtaa na barabara.");
}

/* ---------- 🔎 SEARCH (Nominatim + ndani: miji/marker/hatari/sites) ---------- */
function localMatches(v) {
  const out = [];
  const g = window.MT_GEO_FULL || {};
  (g.cities || []).forEach((c) => { if (c.name.toLowerCase().includes(v)) out.push({ name: c.name, detail: "Mji — Tanzania", lat: c.lat, lng: c.lng, level: "mji" }); });
  (g.markers || []).forEach((m) => { if ((m.name || "").toLowerCase().includes(v)) out.push({ name: m.name, detail: m.place || m.kind, lat: m.lat, lng: m.lng, level: m.kind }); });
  ((window.MT_GEO_3D && window.MT_GEO_3D.hazards) || []).forEach((h) => { if ((h.name || "").toLowerCase().includes(v)) out.push({ name: h.name, detail: h.place || "hatari", lat: h.lat, lng: h.lng, level: "hatari" }); });
  Object.keys(IOT_SITES).forEach((k) => { if (IOT_SITES[k].name.toLowerCase().includes(v)) out.push({ name: IOT_SITES[k].name, detail: "site ya IoT", lat: IOT_SITES[k].lat, lng: IOT_SITES[k].lng, level: "site" }); });
  /* HIERARKIA: mikoa→wilaya→tarafa→kata→vijiji→vitongoji→mtaa→barabara */
  if (window.MT_HIER && window.MT_HIER.features) {
    const SW = { mkoa: "Mkoa", wilaya: "Wilaya", tarafa: "Tarafa", kata: "Kata", kijiji: "Kijiji", vitongoji: "Kitongoji", mtaa: "Mtaa", barabara: "Barabara" };
    window.MT_HIER.features.forEach((f) => {
      const p = f.properties;
      if ((p.name_sw || "").toLowerCase().includes(v)) {
        out.push({ name: p.name_sw, detail: SW[p.level] + " · " + p.region + (p.parent ? " — " + p.parent : ""), lat: p.lat, lng: p.lng, level: SW[p.level] || p.level, hierId: p.id });
      }
    });
  }
  return out.slice(0, 5);
}
const qIn = document.getElementById("q3d"), qList = document.getElementById("qList");
let qTimer = null, qResults = [];
qIn.addEventListener("input", () => {
  clearTimeout(qTimer);
  const v = qIn.value.trim().toLowerCase();
  if (v.length < 2) { qList.style.display = "none"; return; }
  qTimer = setTimeout(() => doSearch(v), 350);
});
async function doSearch(v) {
  qResults = localMatches(v);
  try {
    const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=sw&viewbox=29.2,-11.9,40.7,-0.9&q=" + encodeURIComponent(v));
    if (r.ok) {
      (await r.json()).forEach((x) => qResults.push({ name: (x.display_name || "").split(",")[0], detail: (x.display_name || "").slice(0, 70), lat: +x.lat, lng: +x.lon, level: "OSM" }));
    }
  } catch (e) { /* offline — ndani pekee */ }
  qResults = qResults.slice(0, 8);
  qList.innerHTML = qResults.map((o) => "<div><b>" + o.name + "</b><span class=\"lvl\">" + o.level + "</span><div class=\"lvl\">" + (o.detail || "") + "</div></div>").join("");
  qList.style.display = qResults.length ? "block" : "none";
  Array.prototype.forEach.call(qList.children, (el, i) => { el.onclick = () => pickResult(qResults[i]); });
}
function pickResult(o) {
  qList.style.display = "none";
  qIn.value = o.name;
  if (o.hierId) {
    MT3D.hierZoom(o.hierId);
  } else {
    map.flyTo({ center: [o.lng, o.lat], zoom: 14, pitch: 62, duration: 2600 });
  }
  if (!map._mtDest) map._mtDest = new maplibregl.Marker({ color: "#ffb300" }).setLngLat([o.lng, o.lat]).addTo(map);
  else map._mtDest.setLngLat([o.lng, o.lat]);
  MT3D.routeTo(o.lat, o.lng, o.name);
}

    box.style.display = "block";
    box.innerHTML = "<b>Hali ya hewa (eneo la mtazamo):</b> " + cond + " · " + cur.temperature_2m + "°C · Upepo " +
      cur.wind_speed_10m + " km/h · Mvua " + (cur.precipitation || 0) + " mm";
    const badge = document.getElementById("weatherBadge");
    badge.textContent = "Hewa: " + cur.temperature_2m + "°C · " + cond;
    badge.className = "badge info";
    if ((cur.weather_code || 0) >= 65 || (cur.precipitation || 0) > 5) {
      badge.className = "badge danger";
      if (announce) speak(VOICE_PROMPTS.weather_alert + " " + cond + ". Kuwa makini.");
    } else if (announce) {
      speak("Hali ya hewa: " + cond + ", digrii " + Math.round(cur.temperature_2m));
    }
  } catch (e) {
    document.getElementById("weatherBadge").textContent = "Hewa: haipatikani";
  }
}
function weatherCodeSw(code) {
  if (code === 0) return "Anga safi"; if (code <= 3) return "Mawingu kidogo"; if (code <= 48) return "Ukungu";
  if (code <= 57) return "Manyunyu"; if (code <= 67) return "Mvua"; if (code <= 77) return "Theluji";
  if (code <= 82) return "Mvua kubwa"; if (code <= 99) return "Radi"; return "Hali ya hewa";
}

/* ---------- REAL-TIME ENGINE (saa hai + pulse ya vifaa — gharama ndogo) ---------- */
/* 1) Saa hai: badge inajisasisha kila sekunde (DOM moja tu) */
setInterval(() => {
  const el = document.getElementById("liveBadge");
  if (el) el.textContent = "LIVE: " + new Date().toLocaleTimeString("en-GB");
}, 1000);

/* 2) Pulse ya IoT: opacity inavuka taratibu (setPaintProperty, si redraw ya tiles) */
let pulseT = 0;
setInterval(() => {
  pulseT = (pulseT + 1) % 40;
  try {
    if (map.getLayer("iot-pulse")) {
      map.setPaintProperty("iot-pulse", "circle-opacity", 0.10 + 0.10 * (0.5 + 0.5 * Math.sin((pulseT / 40) * Math.PI * 2)));
    }
  } catch (e) { /* layer imeondolewa — OK */ }
}, 100);

/* ---------- FPS METER (uthibitisho wa "RAM/resource ndogo") ---------- */
let frames = 0, lastT = performance.now();
function tickFps(now) {
  frames++;
  if (now - lastT >= 1000) {
    document.getElementById("fpsBadge").textContent = "fps: " + frames + " (GPU)";
    frames = 0; lastT = now;
  }
  requestAnimationFrame(tickFps);
}
requestAnimationFrame(tickFps);

/* Voice list lazy-load (Chrome) */
if (window.speechSynthesis) speechSynthesis.getVoices();
</script>
