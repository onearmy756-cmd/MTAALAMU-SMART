[package]
name = "mtaalamu-engine"
version = "1.1.0"
edition = "2021"
description = "MTAALAMU SMART - Math/Inference Engine (Rust) - hesabu halisi bila uongo"

[lib]
name = "mtaalamu_engine"
path = "src/lib.rs"

[[bin]]
name = "mtaalamu"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = true
